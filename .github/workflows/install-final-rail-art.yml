name: Install final rail art

on:
  push:
    branches:
      - tmp/final-ive-rails-20260920
    paths:
      - ".tmp/rail-art/ready.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: tmp/final-ive-rails-20260920
          fetch-depth: 0

      - name: Decode approved rail artwork
        run: |
          mkdir -p pages/media/ive
          cat .tmp/rail-art/left-*.b64 | base64 -d > pages/media/ive/wonyoung-left-final.webp
          cat .tmp/rail-art/right-*.b64 | base64 -d > pages/media/ive/ive-right-final.webp
          file pages/media/ive/wonyoung-left-final.webp
          file pages/media/ive/ive-right-final.webp

      - name: Commit decoded artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/media/ive/wonyoung-left-final.webp pages/media/ive/ive-right-final.webp
          git diff --cached --quiet || git commit -m "Install approved final IVE rail artwork"
          git push origin HEAD:tmp/final-ive-rails-20260920
