name: Diagnose Paraguayan Cup fallback

on:
  push:
    paths:
      - .github/workflows/diag-paraguayan-cup.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe fallback
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://soccerway-livescore.acchtt.workers.dev'
          curl --fail --silent --show-error -A 'Mozilla/5.0' "$BASE/api/fixtures?day=-1&diag=$GITHUB_RUN_ID" -o /tmp/feed.json
          curl --fail --silent --show-error -A 'Mozilla/5.0' "$BASE/api/board?day=0&diag=$GITHUB_RUN_ID" -o /tmp/board.json
          python - <<'PY'
          import json
          from pathlib import Path
          for label,path in [('FEED','/tmp/feed.json'),('BOARD','/tmp/board.json')]:
              p=json.loads(Path(path).read_text())
              print(label,'count=',p.get('count'),'matched=',p.get('matchedCount'))
              for f in p.get('fixtures',[]):
                  hay=' '.join(str(f.get(k,'')) for k in ('homeTeam','awayTeam','boardMatch','competition')).lower()
                  if 'tembetary' in hay or 'iteno' in hay or 'iteño' in hay:
                      print(json.dumps(f,ensure_ascii=False,sort_keys=True))
          PY