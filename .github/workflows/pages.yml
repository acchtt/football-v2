name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate schedule artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path('pages')
          required = [
              'index.html',
              'app-v2.js',
              'schedule-v2.css',
              'ive-sidebars.js',
              'pwa-off.js',
              'config.js',
              'strict-board-filter.js',
              'canonical-live-source.js',
              'matchday-behavior.js',
              'media/arcxi/arc-xi-schedule-logo.svg',
              'icons/schedule-competition-mark.svg',
              'media/ive/ive-left-approved.webp',
              'media/ive/ive-right-approved.webp',
              'media/arcxi/reference-artwork.png',
              'media/fonts/DM-Sans.ttf',
          ]
          for path in required:
              target = root / path
              assert target.exists() and target.stat().st_size > 0, f'missing schedule artifact: {target}'

          index = (root / 'index.html').read_text(encoding='utf-8')
          assert 'rel="manifest"' not in index, 'PWA manifest should be disabled'
          assert 'pwa-v2.js' not in index, 'PWA runtime should be disabled'
          assert 'alerts-center.js' not in index, 'PWA-linked alerts runtime should be disabled'
          assert 'pwa-off.js?v=1' in index, 'service-worker cleanup script is missing'
          assert 'app-v2.js?v=62' in index, 'unexpected app asset version'
          assert 'schedule-v2.css?v=9' in index, 'unexpected schedule CSS version'
          assert 'ive-sidebars.js?v=24' in index, 'unexpected corner asset loader version'

          app = (root / 'app-v2.js').read_text(encoding='utf-8')
          assert "schedule-reference-v62" in app, 'unexpected ARC XI schedule build'
          assert 'arc-xi-schedule-logo.svg?v=2' in app, 'schedule logo asset not wired'
          assert 'scheduleCompetitionLogo' in app, 'real competition logo path not wired'

          sidebars = (root / 'ive-sidebars.js').read_text(encoding='utf-8')
          assert 'reference-artwork.png' in (root / 'schedule-v2.css').read_text(), 'reference atmosphere not wired'
          assert 'ive-right-approved.webp?v=1' in sidebars, 'bottom IVE corner asset not wired'

          for path in [
              root / 'media/arcxi/arc-xi-schedule-logo.svg',
              root / 'icons/schedule-competition-mark.svg',
              root / 'media/arcxi/arc-xi-schedule-logo.svg',
              root / 'icons/schedule-competition-mark.svg',
          ]:
              ET.parse(path)

          print('Schedule artifact validated')
          PY

          for js in             pages/app-v2.js             pages/youtube-player.js             pages/config.js             pages/strict-board-filter.js             pages/canonical-live-source.js             pages/matchday-behavior.js             pages/ive-sidebars.js             pages/pwa-off.js; do
            node --check "$js"
          done
          node scripts/check-schedule.cjs
          echo "Active JavaScript syntax and schedule rendering validated"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
