name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate PWA raster icons
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rsvg-convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq librsvg2-bin
          fi
          rsvg-convert -w 192 -h 192 pages/icons/sliptrace.svg -o pages/icons/sliptrace-192.png
          rsvg-convert -w 512 -h 512 pages/icons/sliptrace.svg -o pages/icons/sliptrace-512.png
          rsvg-convert -w 512 -h 512 pages/icons/sliptrace-maskable.svg -o pages/icons/sliptrace-maskable-512.png

      - name: Validate PWA artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('pages')
          manifest=json.loads((root/'manifest.webmanifest').read_text(encoding='utf-8'))
          assert manifest['name'] and manifest['short_name']
          assert manifest['start_url'].startswith('./')
          assert manifest['display'] in {'standalone','fullscreen','minimal-ui'}
          sizes={i.get('sizes') for i in manifest['icons']}
          assert '192x192' in sizes and '512x512' in sizes
          for icon in manifest['icons']:
              p=root/icon['src'].replace('./','',1)
              assert p.exists(), f'missing manifest icon: {p}'
          for required in [
              'index.html','sw.js','offline.html','pwa-v2.js','mobile-v2.css',
              'mobile-v3.css','mobile-v4.css','mobile-layout-v3.js',
              'desktop-front-v2.css','desktop-front-v2.js','matchday-behavior.js',
              'strict-board-filter.js','strict-board-guard.js',
              'alerts-center.js','alerts-center.css','ive-sidebars.css','ive-sidebars.js'
          ]:
              assert (root/required).exists(), f'missing {required}'
          approved_rails={
              'ive-left-final.svg':('666b9f52ac18c75770ad7a9177fce49723fdb89c', 2_000_000),
              'ive-right-final.png':('97dfa8b37a6bcfc154e579a738f77a8ff080cca8', 2_000_000),
          }
          for name, (expected_blob, min_size) in approved_rails.items():
              p=root/'media'/'ive'/name
              assert p.exists() and p.stat().st_size > min_size, f'missing/invalid approved IVE rail artwork: {p}'
              data=p.read_bytes()
              actual_blob=hashlib.sha1(b'blob '+str(len(data)).encode()+bytes([0])+data).hexdigest()
              assert actual_blob == expected_blob, f'approved IVE rail artwork changed unexpectedly: {name}'
          sidebars=(root/'ive-sidebars.js').read_text(encoding='utf-8')
          assert 'ive-left-final.svg?v=3' in sidebars and 'ive-right-final.png?v=5' in sidebars, 'approved rail URLs are not pinned to expected versions'
          print('PWA artifact validated')
          PY
          for js in pages/pwa-v2.js pages/alerts-center.js pages/mobile-layout-v3.js pages/desktop-front-v2.js pages/matchday-behavior.js pages/strict-board-filter.js pages/strict-board-guard.js pages/ive-sidebars.js pages/sw.js; do
            node --check "$js"
          done
          echo "PWA JavaScript syntax validated"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
