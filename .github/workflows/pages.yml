name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate schedule artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path('pages')
          required = [
              'index.html',
              'app-v2.js',
              'schedule-v2.css',
              'ive-sidebars.js',
              'schedule-logos.js',
              'pwa-off.js',
              'config.js',
              'strict-board-filter.js',
              'canonical-live-source.js',
              'matchday-behavior.js',
              'media/arcxi/arc-xi-schedule-logo.svg',
              'icons/schedule-competition-mark.svg',
              'icons/arc-xi-schedule.svg',
              'icons/arc-xi-schedule.ico',
              'media/ive/ive-left-approved.webp',
              'media/ive/ive-right-approved.webp',
              'media/ive/wonyoung-liz-bottom-right.webp',
              'media/arcxi/reference-artwork.png',
              'media/fonts/DM-Sans.ttf',
          ]
          for path in required:
              target = root / path
              assert target.exists() and target.stat().st_size > 0, f'missing schedule artifact: {target}'

          index = (root / 'index.html').read_text(encoding='utf-8')
          assert 'rel="manifest"' not in index, 'PWA manifest should be disabled'
          assert 'pwa-v2.js' not in index, 'PWA runtime should be disabled'
          assert 'alerts-center.js' not in index, 'PWA-linked alerts runtime should be disabled'
          assert 'pwa-off.js?v=1' in index, 'service-worker cleanup script is missing'
          assert 'app-v2.js?v=71' in index, 'unexpected app asset version'
          assert 'schedule-v2.css?v=28' in index, 'unexpected schedule CSS version'
          assert 'ive-sidebars.js?v=29' in index, 'unexpected corner asset loader version'
          assert 'icons/arc-xi-schedule.svg?v=2' in index, 'current favicon not wired'
          assert 'schedule-logos.js?v=2' in index, 'independent schedule logo lookup is missing'

          app = (root / 'app-v2.js').read_text(encoding='utf-8')
          assert "schedule-reference-v66" in app, 'unexpected ARC XI schedule build'
          assert 'arc-xi-schedule-logo.svg?v=3' in app, 'schedule logo asset not wired'
          assert 'scheduleCompetitionLogo' in app, 'real competition logo path not wired'

          sidebars = (root / 'ive-sidebars.js').read_text(encoding='utf-8')
          assert 'wonyoung-liz-bottom-right.webp' in app, 'Wonyoung + Liz artwork not wired'
          assert "buildCorner('top')" not in sidebars, 'upper-left artwork should be removed'

          for path in [
              root / 'icons/arc-xi-schedule.svg',
              root / 'media/arcxi/arc-xi-schedule-logo.svg',
              root / 'icons/schedule-competition-mark.svg',
              root / 'media/arcxi/arc-xi-schedule-logo.svg',
              root / 'icons/schedule-competition-mark.svg',
          ]:
              ET.parse(path)

          print('Schedule artifact validated')
          PY

          for js in             pages/app-v2.js             pages/youtube-player.js             pages/config.js             pages/strict-board-filter.js             pages/canonical-live-source.js             pages/matchday-behavior.js             pages/ive-sidebars.js             pages/pwa-off.js; do
            node --check "$js"
          done
          node scripts/check-schedule.cjs
          node --check pages/schedule-logos.js
          node scripts/check-schedule-logos.cjs
          node scripts/test-dashboard-fallback.cjs
          node scripts/test-status-precedence.cjs
          echo "Active JavaScript syntax, dashboard fallback and schedule rendering validated"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # The deploy job only validates the artifact. This independent post-deploy
  # check visits the actual public URL and does not write scores or bet data.
  production-smoke:
    name: Post-deployment public feed and live-score parity
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm this release reached the public Pages URL
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const local = readFileSync('pages/index.html','utf8');
          const assets = ['app-v2.js','config.js','canonical-live-source.js','schedule-v2.css'];
          const required = assets.map(asset => {
            const match = local.match(new RegExp(asset.replaceAll('.', '\\.') + '\\?v=\\d+'));
            if (!match) throw Error('Release marker missing: ' + asset);
            return match[0];
          });
          let confirmed = false;
          for (let attempt = 1; attempt <= 10; attempt++) {
            try {
              const url = 'https://acchtt.github.io/football-v2/?postdeploy=' + Date.now();
              const response = await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(10000)});
              const html = await response.text();
              if (response.ok && required.every(marker => html.includes(marker))) {
                console.log('PASS deployed release markers', required.join(', '));
                confirmed = true; break;
              }
              console.log('Waiting for Pages edge release, attempt ' + attempt);
            } catch (error) { console.log('Transient Pages check: ' + error.message); }
            await new Promise(resolve => setTimeout(resolve,5000));
          }
          if (!confirmed) throw Error('New Pages build not yet visible at public URL');
          NODE
      - name: Confirm deployed assets, API health and schedule
        run: node scripts/check-production-feed.mjs
      - name: Confirm comparator behavior
        run: node --test scripts/test-live-score-parity.mjs
      - name: Prepare Chrome parity probe
        run: |
          mkdir -p /tmp/arcxi-browser
          npm install --prefix /tmp/arcxi-browser --no-audit --no-fund --no-save puppeteer-core@24
          which google-chrome || which google-chrome-stable
      - name: Compare public live scores and rendered fixtures
        run: node scripts/check-live-render.mjs
      - name: Upload production parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deployment-live-parity
          path: |
            audit-live/parity.json
            audit-live/production-board.png
          retention-days: 14
          if-no-files-found: ignore
