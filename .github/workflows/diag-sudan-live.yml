name: Diagnose Sudan Ethiopia live lag

on:
  push:
    paths:
      - .github/workflows/diag-sudan-live.yml
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Compare raw live feeds
        run: |
          set -e
          for host in soccerway.com flashscore.com
          do
            echo "===== $host ====="
            tmp=$(mktemp)
            code=$(curl -L -sS -o "$tmp" -w '%{http_code}' \
              -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153.0.0.0 Safari/537.36' \
              -H 'Accept: */*' \
              -H 'Accept-Language: en-GB,en;q=0.9' \
              -H "Referer: https://www.$host/" \
              -H "Origin: https://www.$host" \
              -H 'x-fsign: SW9D1eZo' \
              "https://www.$host/x/feed/f_1_0_3_en_1")
            echo "HTTP $code bytes $(wc -c < "$tmp")"
            tr '¬' '\n' < "$tmp" | grep -Ei -B 18 -A 35 '~AA÷dYsi4GbD|AA÷dYsi4GbD|AE÷Sudan|AF÷Ethiopia' | head -n 220 || true
            rm -f "$tmp"
          done
