name: Diagnose Sudan Ethiopia live lag

on:
  push:
    paths:
      - .github/workflows/diag-sudan-live.yml
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production feeds
        run: |
          set -e
          stamp=$(date +%s)
          for spec in \
            "PRIMARY|https://football-v2.acchtt.workers.dev/api/soccerway/board?day=0&t=$stamp" \
            "BOARD|https://soccerway-livescore.acchtt.workers.dev/api/board?day=0&t=$stamp" \
            "FIXTURES0|https://soccerway-livescore.acchtt.workers.dev/api/fixtures?day=0&t=$stamp" \
            "LIVE0|https://soccerway-livescore.acchtt.workers.dev/api/live?day=0&t=$stamp" \
            "FIXTURESM1|https://soccerway-livescore.acchtt.workers.dev/api/fixtures?day=-1&t=$stamp" \
            "LIVEM1|https://soccerway-livescore.acchtt.workers.dev/api/live?day=-1&t=$stamp"
          do
            label=${spec%%|*}
            url=${spec#*|}
            echo "===== $label ====="
            curl -fsSL --retry 2 "$url" | jq -c '
              {generatedAt,cached,count,liveCount},
              ((.fixtures // .data.fixtures // [])[] |
                select((((.homeTeam // "") + " " + (.awayTeam // "") + " " + (.boardMatch // "")) | ascii_downcase) |
                contains("sudan") or contains("ethiopia")) |
                {matchId,boardId,boardMatch,homeTeam,awayTeam,homeScore,awayScore,status,statusText,minute,rawStatusCode,kickoffUtcSource,boardKickoff,matchedToSoccerway,source})'
          done
      - name: Probe raw Soccerway record
        run: |
          set -e
          tmp=$(mktemp)
          code=$(curl -L -sS -o "$tmp" -w '%{http_code}' \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153.0.0.0 Safari/537.36' \
            -H 'Accept: */*' -H 'Accept-Language: en-GB,en;q=0.9' \
            -H 'Referer: https://www.soccerway.com/' -H 'Origin: https://www.soccerway.com' \
            -H 'x-fsign: SW9D1eZo' 'https://www.soccerway.com/x/feed/f_1_0_3_en_1')
          echo "HTTP $code bytes $(wc -c < "$tmp")"
          tr '¬' '\n' < "$tmp" | grep -Ei -B 15 -A 25 'Sudan|Ethiopia' | head -n 160 || true
