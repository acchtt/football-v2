name: Diagnose Sudan Ethiopia detail score

on:
  push:
    paths:
      - .github/workflows/diag-sudan-live.yml
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe detail score snapshots
        run: |
          set -e
          tmp=$(mktemp)
          curl -L -fsSL \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153.0.0.0 Safari/537.36' \
            -H 'Accept: */*' -H 'Accept-Language: en-GB,en;q=0.9' \
            -H 'Referer: https://www.flashscore.com/' -H 'Origin: https://www.flashscore.com' \
            -H 'x-fsign: SW9D1eZo' \
            'https://www.flashscore.com/x/feed/df_sui_1_dYsi4GbD' -o "$tmp"
          echo "===== ALL RELEVANT DETAIL FIELDS ====="
          tr '¬' '\n' < "$tmp" | grep -E '^(~?AC|~?III|IA|IB|IBX|IE|IEX|IF|IK|INX|IOX|IG|IH)÷' || true
          rm -f "$tmp"
