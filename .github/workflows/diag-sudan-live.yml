name: Diagnose Sudan Ethiopia BSD binding

on:
  push:
    paths:
      - .github/workflows/diag-sudan-live.yml
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe BSD production feeds
        run: |
          set -e
          stamp=$(date +%s)
          for spec in \
            "BSD_LIVE|https://football-v2.acchtt.workers.dev/api/bsd/live?t=$stamp" \
            "BSD_EVENTS|https://football-v2.acchtt.workers.dev/api/bsd/events?date_from=2026-09-25%26date_to=2026-09-25%26limit=200%26t=$stamp" \
            "DASHBOARD|https://football-v2.acchtt.workers.dev/api/dashboard-data?t=$stamp"
          do
            label=${spec%%|*}
            url=${spec#*|}
            echo "===== $label ====="
            tmp=$(mktemp)
            curl -fsSL --retry 2 "$url" -o "$tmp"
            jq -c '.. | objects | select((tostring | ascii_downcase | contains("sudan")) or (tostring | ascii_downcase | contains("ethiopia"))) | {id,event_id,match,name,home,away,home_name,away_name,home_team,away_team,home_score,away_score,score,status,minute,current_minute,period,kickoff,start_time,timestamp,competition,league,slateDate,displayKickoff,bsd}' "$tmp" | head -n 120 || true
            rm -f "$tmp"
          done
