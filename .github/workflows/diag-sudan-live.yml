name: Diagnose Sudan Ethiopia detail feed

on:
  push:
    paths:
      - .github/workflows/diag-sudan-live.yml
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe per-match detail feeds
        run: |
          set -e
          probe () {
            label="$1"
            url="$2"
            echo "===== $label ====="
            tmp=$(mktemp)
            code=$(curl -L -sS -o "$tmp" -w '%{http_code}' \
              -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153.0.0.0 Safari/537.36' \
              -H 'Accept: */*' -H 'Accept-Language: en-GB,en;q=0.9' \
              -H 'Referer: https://www.flashscore.com/' -H 'Origin: https://www.flashscore.com' \
              -H 'x-fsign: SW9D1eZo' "$url" || true)
            echo "HTTP $code bytes $(wc -c < "$tmp")"
            tr '¬' '\n' < "$tmp" | head -n 260
            rm -f "$tmp"
          }
          probe "FLASHCORE DIRECT DETAIL" "https://www.flashscore.com/x/feed/df_sui_1_dYsi4GbD"
          probe "FLASHCORE NINJA DETAIL" "https://local-global.flashscore.ninja/2/x/feed/df_sui_1_dYsi4GbD"
          probe "SOCCERWAY DETAIL" "https://www.soccerway.com/x/feed/df_sui_1_dYsi4GbD"
