name: Diagnose Sudan Ethiopia live lag

on:
  push:
    paths:
      - .github/workflows/diag-sudan-live.yml
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Compare Soccerway and Flashscore raw feeds
        run: |
          set -e
          probe () {
            label="$1"
            url="$2"
            referer="$3"
            origin="$4"
            fsign="$5"
            tmp=$(mktemp)
            code=$(curl -L -sS -o "$tmp" -w '%{http_code}' \
              -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153.0.0.0 Safari/537.36' \
              -H 'Accept: */*' -H 'Accept-Language: en-GB,en;q=0.9' \
              -H "Referer: $referer" -H "Origin: $origin" -H "x-fsign: $fsign" "$url")
            echo "===== $label HTTP $code bytes $(wc -c < "$tmp") ====="
            python3 -c 'import sys; raw=open(sys.argv[1],encoding="utf-8",errors="replace").read(); out=[]; cur={}; wanted={"AA","AB","AC","AW","BX","AE","AF","AG","AH","AD","JA","JB"}; comp="";
for tok in raw.split("¬"):
 tok=tok[1:] if tok.startswith("~") else tok
 if "÷" not in tok: continue
 k,v=tok.split("÷",1)
 if k=="AA":
  if cur and ("sudan" in (cur.get("AE","")+" "+cur.get("AF","")).lower() or "ethiopia" in (cur.get("AE","")+" "+cur.get("AF","")).lower()): out.append(cur)
  cur={"AA":v}
 elif k in wanted and cur: cur[k]=v
if cur and ("sudan" in (cur.get("AE","")+" "+cur.get("AF","")).lower() or "ethiopia" in (cur.get("AE","")+" "+cur.get("AF","")).lower()): out.append(cur)
print(*out,sep="\n")' "$tmp"
            rm -f "$tmp"
          }
          probe "SOCCERWAY" "https://www.soccerway.com/x/feed/f_1_0_3_en_1" "https://www.soccerway.com/" "https://www.soccerway.com" "SW9D1eZo"
          probe "FLASHSCORE same signature" "https://www.flashscore.com/x/feed/f_1_0_3_en_1" "https://www.flashscore.com/" "https://www.flashscore.com" "SW9D1eZo"
      - name: Fetch Flashscore match page
        run: |
          set -e
          tmp=$(mktemp)
          code=$(curl -L -sS -o "$tmp" -w '%{http_code}' \
            -H 'User-Agent: Mozilla/5.0' \
            'https://www.flashscore.com/match/football/ethiopia-pntsSTdl/sudan-E3kBXkZQ/?mid=dYsi4GbD')
          echo "HTTP $code bytes $(wc -c < "$tmp")"
          grep -o -Ei '.{0,120}(Sudan|Ethiopia|1-1|2nd Half|Half Time).{0,120}' "$tmp" | head -n 80 || true
