name: Diagnose Sudan Ethiopia realtime feed

on:
  push:
    paths:
      - .github/workflows/diag-sudan-live.yml
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe realtime update feeds
        run: |
          set -e
          probe () {
            label="$1"
            url="$2"
            echo "===== $label ====="
            tmp=$(mktemp)
            code=$(curl -L -sS -o "$tmp" -w '%{http_code}' \
              -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153.0.0.0 Safari/537.36' \
              -H 'Accept: */*' -H 'Accept-Language: en-GB,en;q=0.9' \
              -H 'Referer: https://www.flashscore.com/' -H 'Origin: https://www.flashscore.com' \
              -H 'x-fsign: SW9D1eZo' "$url" || true)
            echo "HTTP $code bytes $(wc -c < "$tmp")"
            tr '¬' '\n' < "$tmp" | grep -Ei -B 24 -A 50 'dYsi4GbD|Sudan|Ethiopia' | head -n 260 || true
            rm -f "$tmp"
          }
          probe "NINJA r_1_1" "https://local-global.flashscore.ninja/2/x/feed/r_1_1"
          probe "FLASHCORE r_1_1" "https://www.flashscore.com/x/feed/r_1_1"
          probe "NINJA r_1_1_en_1" "https://local-global.flashscore.ninja/2/x/feed/r_1_1_en_1"
