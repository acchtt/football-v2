name: Persist Impeccable critique

on:
  push:
    paths:
      - .github/workflows/impeccable-critique-persist.yml

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Persist critique snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/impeccable-report.md <<'REPORT'
⚠️ DEGRADED: single-context (no sub-agent/Task tool is exposed in this session; browser automation is also unavailable)

Provenance: Assessment A used current source and latest UI screenshots. Assessment B used the Impeccable detector against pages/. No browser overlay was available.

# Overall impression

ARC XI has a genuinely distinctive campaign layer, but the product layer is still uneven. The hero, side artwork, plum/black palette, serif branding, and pink highlights clearly belong to this project. Below that, the UI falls back toward a generic dark livescore/dashboard grammar with dense tiny controls and weak navigation.

Design-specificity verdict: strong at the brand/hero level; moderate at the core football-product level.

# Heuristic score

1. Visibility of system status — 3/4
2. Match with real world — 2/4
3. User control & freedom — 1/4
4. Consistency & standards — 2/4
5. Error prevention — 3/4
6. Recognition over recall — 1/4
7. Flexibility & efficiency — 2/4
8. Aesthetic/minimalist design — 2/4
9. Error recovery — 3/4
10. Help/documentation — 1/4

Total: 20/40

# Cognitive load

5 of 8 checks fail: high cognitive load. Before selecting a match, the Board can expose 14 visible decisions: 7 dates, 4 status filters, and 3 signal filters. Main failures are single focus, chunking, one thing at a time, minimal choices, and progressive disclosure.

# Emotional journey

Peak: the ARC XI × IVE hero is authored, premium, and memorable.
Valley: the transition into dense 8–10px utility controls feels like a different product.
End state: match cards are functional but do not create one obvious focal match.

# What's working

- The identity is specific: dark plum, pink highlight system, serif ARC XI branding, IVE artwork, restrained editorial graphics.
- The match-card information model is sound: competition grouping, team symmetry, centered state, score/status, model tiering, and manual-score fallbacks.
- Data-integrity states are thoughtful: delayed-data behavior, manual scores, disabled dates, loading skeletons, and no false zero-match days.

# Priority issues

## [P1] Desktop information architecture has been over-pruned
Desktop users no longer have an obvious route to Picks, Competitions, Teams, Search, Alerts, or other major areas after both header controls and the left rail were removed.
Fix: restore a minimal desktop navigation model with 3–4 compact destinations or a single discreet command/menu trigger.
Suggested command: /impeccable layout

## [P1] The Board exposes too many controls before the user sees value
Seven date buttons, four status buttons, and three signal buttons create 14 choices before core football content.
Fix: keep date primary, collapse signal filters behind one Model control, reduce visible status choices, and make the default feed more self-prioritizing.
Suggested command: /impeccable distill

## [P1] Typography is too small in the operating layer
Current styles use many 8–10px labels for dates, competitions, filters, metadata, and signal labels.
Fix: set an 11–12px floor for primary metadata and reserve 10px for truly tertiary labels; increase line-height and contrast.
Suggested command: /impeccable typeset

## [P2] The hero is visually excellent but functionally oversized for an Operate surface
The hero owns the strongest visual weight even though the primary task is checking matches.
Fix: keep the artwork but make it a shorter matchday masthead, with a quieter or partially collapsed state for returning users.
Suggested command: /impeccable layout

## [P2] Model language is not self-explanatory
Focus, Watchlist, grades, BSD, and source badges assume prior knowledge.
Fix: add a concise tooltip, legend, or first-use disclosure.
Suggested command: /impeccable clarify

# Detector evidence

The deterministic scan returned 31 findings. Six are on files actively loaded by the current homepage; 25 are mostly legacy/unused CSS findings.

Active findings:
- 2 gradient-text warnings
- 2 side-tab accent warnings
- 1 pulsing status-dot warning
- 1 colored dark-glow warning

The live pulsing dot is likely a false positive because it represents genuinely changing live data. Restrained pink glow and pearlescent text are also part of the locked art direction and should be judged by restraint rather than removed automatically.

The larger repository-level signal is that many legacy stylesheets still carry old Inter-heavy, side-accent, grid-background, and dashboard-pattern rules, which increases the chance of visual regression.

# Persona red flags

Alex — Power User: desktop lost obvious routes to Picks, Teams, Competitions, and Search; no keyboard command path is visible; the manual refresh action is defined in code but absent from the rendered hero.

Sam — Accessibility-dependent user: ARIA grouping, live-region status, and focus rules are good, but 8–10px text and low-contrast tertiary labels are weak for low vision, and model grades should not rely on color alone.

Casey — Distracted Mobile User: bottom navigation and 44px targets are good, but date + status + signal choices still impose too much attention cost before the match list.

# Minor observations

The YouTube player is structurally cleaner outside the context rail but should remain secondary to match content. The context clock has personality, though BSD/ICT metadata should not compete with match states. The CSS estate contains many historical layers that can reintroduce old visual language.

# Questions to consider

- What if ARC XI treated the Board as a curated feed first, with filters secondary?
- What if desktop navigation collapsed to one compact navigation affordance plus the ARC XI identity?
- What if the hero stayed visually intact but became half as tall for returning users?

REPORT
