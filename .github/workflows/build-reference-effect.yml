name: Build ARC XI reference effect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-reference-effect.yml"
      - "pages/media/arcxi/reference-artwork.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install image tools
        run: python -m pip install pillow numpy

      - name: Extract reference atmosphere
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path
          import numpy as np

          src=Path('pages/media/arcxi/reference-artwork.png')
          out=Path('pages/media/arcxi/reference-effect-hd.webp')
          im=Image.open(src).convert('RGB')
          a=np.asarray(im).astype(np.float32)/255.0
          r,g,b=a[...,0],a[...,1],a[...,2]
          mx=a.max(axis=2); mn=a.min(axis=2)
          sat=np.divide(mx-mn,mx,out=np.zeros_like(mx),where=mx>1e-5)
          h,w=r.shape
          yy,xx=np.mgrid[0:h,0:w]
          xn=xx/(w-1); yn=yy/(h-1)

          pink=(r>g*1.12)&(r>0.12)&(b>g*0.62)&(sat>0.18)
          gold=(r>0.20)&(g>0.12)&(r>b*1.18)&(g>b*.95)&(sat>0.16)

          # Literal artwork geometry from the approved reference.
          # Upper-left crown/light occupies the far-left edge; after ~9% width it
          # becomes ARC XI/UI, so never sample beyond that boundary.
          left_upper=(xn<0.092)&(yn<0.24)
          left_lower=(xn<0.055)&(yn>=0.20)&(yn<0.50)

          # Lower-right artwork: keep only the outermost edge/crown region.
          right_art=(xn>0.855)&(yn>0.54)

          # Bottom pink/gold light sweep starts below the schedule rows.
          lower_sweep=(yn>0.82)&(xn>0.60)

          zone=left_upper|left_lower|right_art|lower_sweep

          # Strictly chromatic pixels only: this intentionally rejects white text,
          # chevrons, neutral dividers, score labels and competition/team UI.
          chroma=(sat>.20)&(mx>.055)
          strength=np.clip((sat-.18)/.68,0,1)*np.clip((mx-.045)/.78,0,1)
          alpha=np.where((pink|gold)&chroma&zone,strength,0.0)

          # Interior fades keep the schedule canvas untouched.
          left_fade=np.clip((.098-xn)/.032,0,1)
          right_fade=np.clip((xn-.845)/.055,0,1)
          bottom_fade=np.clip((yn-.80)/.12,0,1)
          spatial=np.maximum.reduce([
              np.where(left_upper|left_lower,left_fade,0),
              np.where(right_art,right_fade,0),
              np.where(lower_sweep,bottom_fade,0),
          ])
          alpha*=spatial

          # Hard safety cutouts around all live schedule content.
          alpha=np.where((xn>.10)&(xn<.845)&(yn<.82),0,alpha)
          # Remove the first competition mark that sits inside the left artwork column.
          alpha=np.where((xn>.070)&(xn<.105)&(yn>.175)&(yn<.265),0,alpha)

          rgba=np.dstack([np.clip(a*1.06,0,1),alpha])
          effect=Image.fromarray((rgba*255).astype(np.uint8),'RGBA')
          effect.putalpha(effect.getchannel('A').filter(ImageFilter.GaussianBlur(.55)))

          # Add soft halo derived only from the extracted artwork.
          halo=effect.filter(ImageFilter.GaussianBlur(10))
          halo.putalpha(halo.getchannel('A').point(lambda p:int(p*.20)))
          final=Image.new('RGBA',effect.size,(0,0,0,0))
          final.alpha_composite(halo)
          final.alpha_composite(effect)
          final.save(out,'WEBP',quality=91,method=6)
          print('REFERENCE_EFFECT',final.size,out.stat().st_size)
          PY

      - name: Commit effect asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/media/arcxi/reference-effect-hd.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build HD atmosphere from approved ARC XI reference"
          git push
