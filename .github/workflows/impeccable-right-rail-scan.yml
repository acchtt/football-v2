name: Impeccable right rail layout scan

on:
  push:
    paths:
      - .github/workflows/impeccable-right-rail-scan.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load Impeccable context
        shell: bash
        run: |
          set +e
          .github/skills/impeccable/scripts/impeccable context --target pages/index.html > /tmp/context.txt 2>/tmp/context.err
          echo "=== CONTEXT ==="
          cat /tmp/context.txt
          echo "=== CONTEXT STDERR ==="
          cat /tmp/context.err
      - name: Scan right rail layout
        shell: bash
        run: |
          set +e
          .github/skills/impeccable/scripts/impeccable detect --json --scope layout pages/app-v2.js pages/ive-matchday-final.css pages/youtube-player.css > /tmp/layout.json 2>/tmp/layout.err
          echo "=== LAYOUT JSON ==="
          cat /tmp/layout.json
          echo
          echo "=== LAYOUT STDERR ==="
          cat /tmp/layout.err
          exit 0
