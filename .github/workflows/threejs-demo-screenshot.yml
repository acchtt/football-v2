name: Capture Three.js demo

on:
  push:
    branches: ["main"]
    paths:
      - "pages/threejs-demo.html"
      - ".github/workflows/threejs-demo-screenshot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Capture browser render
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 -d pages >/tmp/arcxi-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in {1..20}; do
            if curl -fsS "http://127.0.0.1:8000/threejs-demo.html" >/dev/null; then break; fi
            sleep 1
          done
          mkdir -p .design-review
          timeout 30s "${{ steps.chrome.outputs.chrome-path }}" \
            --headless \
            --no-sandbox \
            --disable-dev-shm-usage \
            --hide-scrollbars \
            --window-size=1920,1080 \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=6000 \
            --screenshot=".design-review/threejs-demo.png" \
            "http://127.0.0.1:8000/threejs-demo.html"
          test -s .design-review/threejs-demo.png

      - name: Commit screenshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .design-review/threejs-demo.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture Three.js demo screenshot"
          git push
