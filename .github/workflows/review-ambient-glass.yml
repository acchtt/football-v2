name: Review ambient glass demo

on:
  push:
    branches: ["main"]
    paths:
      - "pages/threejs-demo.html"
      - ".github/workflows/review-ambient-glass.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Install screenshot driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Capture
        shell: bash
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          python3 -m http.server 8000 -d pages >/tmp/arcxi-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in {1..20}; do
            if curl -fsS "http://127.0.0.1:8000/threejs-demo.html" >/dev/null; then break; fi
            sleep 1
          done
          mkdir -p .design-review
          node <<'NODE'
          const { chromium } = require('playwright-core');
          (async () => {
            const browser = await chromium.launch({
              executablePath: process.env.CHROME_PATH,
              headless: true,
              args: ['--no-sandbox','--disable-dev-shm-usage','--enable-unsafe-swiftshader']
            });
            const page = await browser.newPage({ viewport: { width: 1920, height: 1080 }, deviceScaleFactor: 1 });
            await page.goto('http://127.0.0.1:8000/threejs-demo.html', { waitUntil: 'networkidle', timeout: 30000 });
            await page.waitForTimeout(4500);
            await page.screenshot({ path: '.design-review/ambient-glass.png', fullPage: false });
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          test -s .design-review/ambient-glass.png

      - name: Commit screenshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .design-review/ambient-glass.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture ambient glass demo"
          git push
