name: ARC XI Production Live Feed Health

on:
  workflow_dispatch:
  schedule:
    # Observe read-only public endpoints twice per hour; empty live slates are healthy.
    - cron: '12,42 * * * *'
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/check-production-feed.mjs"
      - "scripts/live-score-parity.mjs"
      - "scripts/check-live-render.mjs"
      - "scripts/test-live-score-parity.mjs"
      - ".github/workflows/production-feed-health.yml"
  push:
    branches: ["monitor/production-feed-20261010", "monitor/live-render-parity-20261010"]
    paths:
      - "scripts/check-production-feed.mjs"
      - "scripts/live-score-parity.mjs"
      - "scripts/check-live-render.mjs"
      - "scripts/test-live-score-parity.mjs"
      - ".github/workflows/production-feed-health.yml"

permissions:
  contents: read

concurrency:
  group: arcxi-production-health
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate probe syntax and read-only surface
        run: |
          node --check scripts/check-production-feed.mjs
          if grep -E 'method:[[:space:]]*["'\''"](POST|PATCH|PUT|DELETE)' scripts/check-production-feed.mjs; then
            echo "A write method was added to the production canary" >&2
            exit 1
          fi
      - name: Probe public production page, dashboard, live and day-feed
        run: node scripts/check-production-feed.mjs
      - name: Validate score comparison logic and browser script
        run: |
          node --check scripts/check-live-render.mjs
          node --test scripts/test-live-score-parity.mjs
      - name: Set up headless Chrome comparison
        run: |
          mkdir -p /tmp/arcxi-browser
          npm install --prefix /tmp/arcxi-browser --no-audit --no-fund --no-save puppeteer-core@24
          which google-chrome || which google-chrome-stable
      - name: Compare real live scores with rendered production fixtures
        run: node scripts/check-live-render.mjs
      - name: Store real-browser parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcxi-production-live-score-parity
          path: |
            audit-live/parity.json
            audit-live/production-board.png
          retention-days: 14
          if-no-files-found: ignore

