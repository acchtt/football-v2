name: ARC XI Demo Repair Regression

on:
  push:
    branches: ["demo/liquid-glass"]
    paths:
      - "pages/**"
      - "demo-preview/check-repair.mjs"
      - "demo-preview/check-preview.mjs"
      - "demo-preview/browser-smoke.mjs"
      - ".github/workflows/liquid-glass-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liquid-glass-repair-regression
  cancel-in-progress: true

jobs:
  verify-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout demo branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check repaired scripts parse cleanly
        shell: bash
        run: |
          set -euo pipefail
          for script in pages/app-v2.js pages/config.js pages/demo-api-bridge.js pages/schedule-logos.js pages/matchday-behavior.js demo-preview/capture-snapshot.mjs; do
            node --check "$script"
          done
      - name: Verify actual date grouping and safe preview behavior
        run: node demo-preview/check-repair.mjs
      - name: Verify snapshot API routing and CORS
        run: node demo-preview/check-preview.mjs
      - name: Check available Chrome version
        shell: bash
        run: |
          which google-chrome || which google-chrome-stable
          google-chrome --version || google-chrome-stable --version
      - name: Install headless Chrome automation library
        shell: bash
        run: |
          mkdir -p /tmp/arcxi-browser
          npm install --prefix /tmp/arcxi-browser --no-save --no-audit --no-fund puppeteer-core@24
      - name: Test desktop and mobile schedule with real saved fixtures
        run: node demo-preview/browser-smoke.mjs
      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-repair-screenshots
          path: demo-preview/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
