name: Inspect ARC XI reference artwork

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/inspect-reference-artwork.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Inspect artwork
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('pages/media/arcxi/reference-artwork.png')
          im=Image.open(p).convert('RGB')
          print('REFERENCE_ARTWORK', im.size, im.mode, p.stat().st_size)
          im.thumbnail((1280,1280))
          Path('.design-review').mkdir(exist_ok=True)
          im.save('.design-review/reference-artwork-preview.jpg', quality=90)
          PY

      - name: Commit preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .design-review/reference-artwork-preview.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Preview ARC XI reference artwork"
          git push
