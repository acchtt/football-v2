name: ARC XI Liquid Glass Preview (demo only)

on:
  push:
    branches: ["demo/liquid-glass"]
    paths:
      - "pages/**"
      - "demo-preview/**"
      - ".github/workflows/liquid-glass-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liquid-glass-demo-preview
  cancel-in-progress: true

jobs:
  deploy-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout demo branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require isolated branch
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/demo/liquid-glass" || {
            echo "::error::Ref is not demo/liquid-glass; refusing deployment."
            exit 1
          }
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Cloudflare preview credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::Preview deploy needs Cloudflare repository secrets. Production environment secrets are NOT accessed."
            exit 1
          }
      - name: Install Wrangler
        run: npm install --ignore-scripts --no-audit --no-fund --no-save wrangler@4
      - name: Deploy separate preview Worker (not football-v2)
        shell: bash
        run: |
          npx wrangler deploy --config demo-preview/wrangler.jsonc --var SOURCE_COMMIT:$GITHUB_SHA
      - name: Report preview URL
        shell: bash
        run: |
          echo "Expected preview: https://football-v2-liquid-glass-demo.acchtt.workers.dev/"
          echo "Commit: $GITHUB_SHA"
          echo "This job never deploys production Pages or the football-v2 production Worker."
