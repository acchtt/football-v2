name: Diagnose Soccerway competition logos

on:
  push:
    paths:
      - .github/workflows/diag-soccerway-league-logo.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect competition pages
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://www.flashscore.com/football/sweden/svenska-cupen-women/' \
            'https://www.flashscore.com/football/europe/uefa-europa-cup-women/'; do
            echo URL=$url
            curl --fail --silent --show-error -A 'Mozilla/5.0' "$url" -o /tmp/page.html || true
            echo SIZE=$(wc -c </tmp/page.html 2>/dev/null || echo 0)
            python - <<'PY'
          import re
          from pathlib import Path
          text=Path('/tmp/page.html').read_text(errors='replace') if Path('/tmp/page.html').exists() else ''
          patterns=[
            r'https://static\.flashscore\.com/res/image/data/[^"\'<> ]+',
            r'"(?:logo|image|imagePath|image_path)"\s*:\s*"([^"]+)"',
            r'tournament(?:Id|StageId|TemplateId)[^\n]{0,200}'
          ]
          for p in patterns:
              hits=re.findall(p,text,re.I)
              print('PATTERN',p,'COUNT',len(hits))
              for h in hits[:20]: print(h)
          PY
          done