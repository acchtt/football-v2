name: Diagnose Soccerway CAF gaps

on:
  push:
    paths:
      - .github/workflows/diag-soccerway-caf.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Soccerway fallback
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://soccerway-livescore.acchtt.workers.dev"
          for day in -1 0 1; do
            curl --fail --silent --show-error -A "Mozilla/5.0" "$BASE/api/fixtures?day=$day&diag=$GITHUB_RUN_ID" -o "/tmp/day$day.json"
          done
          curl --fail --silent --show-error -A "Mozilla/5.0" "$BASE/api/board?day=0&diag=$GITHUB_RUN_ID" -o /tmp/board.json
          python - <<'PY'
          import json
          from pathlib import Path
          names=["togo","burundi","sudan","ethiopia","rwanda","liberia","nigeria","madagascar"]
          for day in (-1,0,1):
              p=json.loads(Path("/tmp/day%s.json" % day).read_text())
              print("DAY", day, "count=", p.get("count"))
              for f in p.get("fixtures",[]):
                  hay=" ".join(str(f.get(k,"")) for k in ("homeTeam","awayTeam","competition","region")).lower()
                  if any(n in hay for n in names):
                      print(json.dumps(f,ensure_ascii=False,sort_keys=True))
          b=json.loads(Path("/tmp/board.json").read_text())
          print("BOARD")
          for f in b.get("fixtures",[]):
              hay=" ".join(str(f.get(k,"")) for k in ("homeTeam","awayTeam","boardMatch","competition")).lower()
              if any(n in hay for n in names):
                  print(json.dumps(f,ensure_ascii=False,sort_keys=True))
          PY
