name: Diagnose client fallback mapping

on:
  push:
    paths:
      - .github/workflows/diag-client-fallback.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Compare production Board rows to fallback rows
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -A 'Mozilla/5.0' 'https://football-v2.acchtt.workers.dev/api/dashboard-data' -o /tmp/dashboard.json
          curl -fsS -A 'Mozilla/5.0' 'https://football-v2.acchtt.workers.dev/api/soccerway/board?day=-1' -o /tmp/fallback.json
          curl -fsS -A 'Mozilla/5.0' 'https://football-v2.acchtt.workers.dev/api/bsd/events?date_from=2026-09-24&date_to=2026-09-24&limit=200' -o /tmp/bsd.json
          python - <<'PY'
          import json,re,unicodedata
          from pathlib import Path
          d=json.loads(Path('/tmp/dashboard.json').read_text())
          f=json.loads(Path('/tmp/fallback.json').read_text())
          b=json.loads(Path('/tmp/bsd.json').read_text())
          def norm(v):
              s=unicodedata.normalize('NFKD',str(v or ''))
              s=''.join(ch for ch in s if not unicodedata.combining(ch)).lower()
              s=re.sub(r'\b(women|woman|ladies|w|femenino|feminine)\b',' ',s)
              s=re.sub(r'\b(fc|cf|afc|sc|ac|sk|fk|club|sv|cd|sd|ifk|bk|ff|dff|ik)\b',' ',s)
              s=re.sub(r'[^a-z0-9]+',' ',s)
              toks=[]
              for t in s.split():
                  toks.append(t[:-1] if len(t)>5 and t.endswith('s') else t)
              return ' '.join(toks)
          def split(v):
              for pat in [r'\s+vs\.?\s+',r'\s+v\.?\s+',r'\s+—\s+',r'\s+–\s+',r'\s+-\s+']:
                  p=[x.strip() for x in re.split(pat,str(v or ''),flags=re.I) if x.strip()]
                  if len(p)==2:return p
              return [str(v or ''),'']
          def key(v):
              a,b=split(v);return norm(a)+'|'+norm(b)
          from datetime import datetime, timezone, timedelta
          ict=timezone(timedelta(hours=7))
          def ictday(r):
              v=r.get('kickoff') or r.get('displayKickoff') or ''
              try:
                  return datetime.fromisoformat(v.replace('Z','+00:00')).astimezone(ict).date().isoformat()
              except Exception:
                  return r.get('slateDate')
          rows=[r for r in d.get('schedule',[]) if ictday(r)=='2026-09-24' and str(r.get('tier','')).upper() in ('FOCUS','WATCHLIST')]
          matched=[x for x in f.get('fixtures',[]) if x.get('matchedToSoccerway') is True]
          byid={str(x.get('boardId')):x for x in matched}
          bykey={key(x.get('boardMatch') or ((x.get('homeTeam') or '')+' vs '+(x.get('awayTeam') or ''))):x for x in matched}
          print('dashboard rows',len(rows),'fallback matched',len(matched),'fallback total',f.get('count'))
          data=b.get('data') if isinstance(b,dict) else {}
          bevents=(data.get('results') or data.get('events') or []) if isinstance(data,dict) else []
          def bname(e,side):
              t=e.get(side+'_team') or e.get(side) or {}
              if isinstance(t,dict): return t.get('name') or t.get('short_name') or ''
              return str(t or e.get(side+'_team_name') or e.get(side+'_name') or '')
          def nscore(a,bb):
              x,y=norm(a),norm(bb)
              if not x or not y:return 0
              if x==y:return 6
              if x in y or y in x:return 4
              A=set(x.split());B=set(y.split());ov=len(A&B)/max(len(A),len(B))
              return 4 if ov>=.75 else 3 if ov>=.5 else 0
          for r in rows:
              h,a=split(r.get('match'))
              hits=[e for e in bevents if nscore(h,bname(e,'home'))+nscore(a,bname(e,'away'))>=6]
              if hits:
                  e=hits[0]
                  print('BSD',r.get('match'),'id=',e.get('id') or e.get('event_id'),'score=',e.get('home_score'),e.get('away_score'),'teams=',bname(e,'home'),'/',bname(e,'away'))
          for r in rows:
              hit=byid.get(str(r.get('id'))) or bykey.get(key(r.get('match')))
              if hit:
                  print('HIT',r.get('id'),r.get('match'),'->',hit.get('homeScore'),hit.get('awayScore'),'bid',hit.get('boardId'),'bmatch',hit.get('boardMatch'))
              else:
                  print('MISS',r.get('id'),r.get('match'),'key=',key(r.get('match')))
          PY