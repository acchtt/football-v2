name: Verify historical Soccerway fallback

on:
  push:
    paths:
      - .github/workflows/verify-historical-fallback.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify primary ARC XI fallback route
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -A 'Mozilla/5.0' 'https://football-v2.acchtt.workers.dev/api/soccerway/board?day=-2' -o /tmp/board.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/board.json').read_text())
          assert p.get('ok') is True, p
          targets={
            'IFK Varnamo Women vs Kristianstads DFF Women':(0,8),
            'Hammarby Women vs Glasgow Rangers Women':(2,0),
            'Feyenoord Women vs Valerenga Women':(4,1),
            'VfL Wolfsburg Women vs Sturm Graz Women':(6,1),
            'Ajax Amsterdam Women vs Aktobe Women':(8,0),
          }
          found={f.get('boardMatch'):f for f in p.get('fixtures',[]) if f.get('boardMatch') in targets}
          assert set(found)==set(targets),(set(targets)-set(found),p.get('matchedCount'))
          for match,score in targets.items():
              f=found[match]
              assert f.get('matchedToSoccerway') is True, f
              assert (f.get('homeScore'),f.get('awayScore'))==score, f
              assert f.get('homeLogoUrl') and f.get('awayLogoUrl') and f.get('competitionLogo'), f
              print(match, f.get('homeScore'), '-', f.get('awayScore'))
          print('matchedCount=',p.get('matchedCount'))
          PY