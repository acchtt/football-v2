name: Deploy Soccerway Livescore

on:
  push:
    branches:
      - main
    paths:
      - "projects/soccerway-livescore/**"
      - ".github/workflows/deploy-soccerway-livescore.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: "Production – football-v2"
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is unavailable to this workflow"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is unavailable to this workflow"
            exit 1
          fi

      - name: Deploy standalone livescore Worker
        working-directory: projects/soccerway-livescore
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Smoke test Soccerway fallback API
        run: |
          set -euo pipefail
          BASE="https://soccerway-livescore.acchtt.workers.dev"

          fetch_json() {
            local name="$1"
            local url="$2"
            local out="$3"
            for attempt in 1 2 3 4 5 6 7 8; do
              echo "Checking $name (attempt $attempt): $url"
              status="$(curl --retry 2 --retry-delay 1 --retry-all-errors -sS -o "$out" -w '%{http_code}' "$url" || true)"
              echo "HTTP $status"
              if [ "$status" -ge 200 ] 2>/dev/null && [ "$status" -lt 300 ] 2>/dev/null; then
                if python - "$out" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              payload=json.load(fh)
          assert payload.get("ok") is True, payload
          PY
                then
                  return 0
                fi
              fi
              cat "$out" || true
              echo
              sleep 2
            done
            echo "::error::$name did not become healthy"
            exit 1
          }

          fetch_json "Soccerway fixtures" "$BASE/api/fixtures?day=0&ci=$GITHUB_RUN_ID" /tmp/feed.json
          fetch_json "Board mapping" "$BASE/api/board?day=0&ci=$GITHUB_RUN_ID" /tmp/board.json
          fetch_json "Live fixtures" "$BASE/api/live?day=0&ci=$GITHUB_RUN_ID" /tmp/live.json

          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/feed.json').read_text())
          b=json.loads(Path('/tmp/board.json').read_text())
          l=json.loads(Path('/tmp/live.json').read_text())
          assert isinstance(p.get('fixtures'), list)
          assert isinstance(b.get('fixtures'), list)
          assert isinstance(l.get('fixtures'), list)
          assert all(str(x.get('tier','')).upper() in ('FOCUS','WATCHLIST') for x in b['fixtures'])
          print('raw_fixtures=', p.get('count', len(p['fixtures'])))
          print('board_fixtures=', b.get('count', len(b['fixtures'])))
          print('matched=', b.get('matchedCount', 0))
          print('live=', l.get('count', len(l['fixtures'])))
          PY
