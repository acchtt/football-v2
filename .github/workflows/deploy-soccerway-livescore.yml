name: Deploy Soccerway Livescore

on:
  push:
    branches:
      - main
    paths:
      - "projects/soccerway-livescore/**"
      - ".github/workflows/deploy-soccerway-livescore.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: "Production – football-v2"
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is unavailable to this workflow"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is unavailable to this workflow"
            exit 1
          fi

      - name: Deploy standalone livescore Worker
        working-directory: projects/soccerway-livescore
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Smoke test Soccerway APIs and server pages
        run: |
          set -euo pipefail
          BASE="https://soccerway-livescore.acchtt.workers.dev"
          for i in 1 2 3 4 5 6 7 8; do
            if curl --fail --silent --show-error "$BASE/?view=today&ci=$GITHUB_RUN_ID" -o /tmp/today.html && \
               curl --fail --silent --show-error "$BASE/?view=board&ci=$GITHUB_RUN_ID" -o /tmp/board-page.html && \
               curl --fail --silent --show-error "$BASE/?view=leagues&ci=$GITHUB_RUN_ID" -o /tmp/leagues.html && \
               curl --fail --silent --show-error "$BASE/?view=teams&ci=$GITHUB_RUN_ID" -o /tmp/teams.html && \
               curl --fail --silent --show-error "$BASE/?view=picks&ci=$GITHUB_RUN_ID" -o /tmp/picks.html && \
               curl --fail --silent --show-error "$BASE/?view=today&status=scheduled&ci=$GITHUB_RUN_ID" -o /tmp/scheduled.html && \
               curl --fail --silent --show-error "$BASE/sliptrace-client-v4.js" -o /tmp/app.js && \
               curl --fail --silent --show-error "$BASE/api/fixtures?day=0" -o /tmp/feed.json && \
               curl --fail --silent --show-error "$BASE/api/board?day=0" -o /tmp/board.json; then
              break
            fi
            sleep 2
          done

          grep -q "Football operations" /tmp/today.html
          grep -q "<h1>Board</h1>" /tmp/board-page.html
          grep -q "<h1>Competitions</h1>" /tmp/leagues.html
          grep -q "<h1>Teams</h1>" /tmp/teams.html
          grep -q "<h1>Picks</h1>" /tmp/picks.html
          grep -q "status-scheduled active" /tmp/scheduled.html
          grep -q 'href="/?view=board' /tmp/today.html
          grep -q 'src="/sliptrace-client-v4.js"' /tmp/today.html
          node --check /tmp/app.js

          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/feed.json').read_text())
          b=json.loads(Path('/tmp/board.json').read_text())
          assert p.get('ok') is True and isinstance(p.get('fixtures'), list) and p['fixtures']
          assert b.get('ok') is True and isinstance(b.get('fixtures'), list)
          assert all(str(x.get('tier','')).upper() in ('FOCUS','WATCHLIST') for x in b['fixtures'])
          print('raw_fixtures=', p.get('count'), 'board_fixtures=', b.get('count'), 'matched=', b.get('matchedCount'))
          PY

      - name: Browser navigation check
        run: |
          set -euo pipefail
          BASE="https://soccerway-livescore.acchtt.workers.dev"
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::No Chrome/Chromium binary available on runner"
            exit 1
          fi
          for route in "?view=today" "?view=board" "?view=leagues" "?view=teams" "?view=picks" "?view=today&status=ft"; do
            "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3500 --dump-dom "$BASE/$route&browser=$GITHUB_RUN_ID" > /tmp/rendered.html 2>/tmp/chrome.log || { cat /tmp/chrome.log; exit 1; }
            grep -q 'data-app-booted="1"' /tmp/rendered.html
            grep -q "SOCCERWAY LIVE" /tmp/rendered.html
          done
