name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "wrangler.jsonc"
      - "package.json"
      - "backend/cloudflare-worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: "Production – football-v2"
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package.json

      - name: Install Worker dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is unavailable to this workflow"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is unavailable to this workflow"
            exit 1
          fi
          echo "Cloudflare credentials are available to this workflow."

      - name: Deploy Worker
        run: npx wrangler@4 deploy --config wrangler.jsonc

      - name: Smoke test production API
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://football-v2.acchtt.workers.dev"
          TODAY="$(TZ=Asia/Ho_Chi_Minh date +%F)"

          check_json() {
            local name="$1"
            local url="$2"
            echo "Checking $name: $url"
            local body
            body="$(mktemp)"
            local status
            status="$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS -o "$body" -w '%{http_code}' "$url")"
            cat "$body"
            echo
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "::error::$name returned HTTP $status"
              exit 1
            fi
            python -c 'import json,sys; p=json.load(open(sys.argv[1],encoding="utf-8")); assert not (isinstance(p,dict) and p.get("ok") is False), "API returned ok=false: "+json.dumps(p)[:500]' "$body"
            rm -f "$body"
          }

          check_json "BSD events" "$BASE/api/bsd/events?date_from=$TODAY&date_to=$TODAY&limit=5"
          check_json "BSD live" "$BASE/api/bsd/live"
          check_json "dashboard" "$BASE/api/dashboard-data"
          check_json "push config" "$BASE/api/push/config"
