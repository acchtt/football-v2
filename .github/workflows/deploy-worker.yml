name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "wrangler.jsonc"
      - "package.json"
      - "backend/cloudflare-worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: "Production – football-v2"
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package.json

      - name: Install Worker dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is unavailable to this workflow"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is unavailable to this workflow"
            exit 1
          fi
          echo "Cloudflare credentials are available to this workflow."

      - name: Ensure persistent Web Push VAPID keys
        shell: bash
        run: |
          set -euo pipefail
          SECRET_FILE="$(mktemp)"
          VAPID_FILE="$(mktemp)"
          trap 'rm -f "$SECRET_FILE" "$VAPID_FILE"' EXIT

          npx wrangler@4 secret list --config wrangler.jsonc --format json > "$SECRET_FILE"

          HAS_PUBLIC="$(node - "$SECRET_FILE" <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          process.stdout.write(Array.isArray(rows) && rows.some(row => row?.name === 'VAPID_PUBLIC_KEY') ? '1' : '0');
          NODE
          )"
          HAS_PRIVATE="$(node - "$SECRET_FILE" <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          process.stdout.write(Array.isArray(rows) && rows.some(row => row?.name === 'VAPID_PRIVATE_KEY') ? '1' : '0');
          NODE
          )"

          if [ "$HAS_PUBLIC" = "1" ] && [ "$HAS_PRIVATE" = "1" ]; then
            echo "Persistent VAPID key pair is already configured."
            exit 0
          fi

          if [ "$HAS_PUBLIC" != "$HAS_PRIVATE" ]; then
            echo "::error::Only one VAPID secret exists. Refusing to rotate a partial key pair because that would invalidate existing browser subscriptions."
            exit 1
          fi

          node - "$VAPID_FILE" <<'NODE'
          const fs = require('fs');
          const webpush = require('web-push');
          fs.writeFileSync(process.argv[2], JSON.stringify(webpush.generateVAPIDKeys()), { mode: 0o600 });
          NODE

          VAPID_PUBLIC_KEY="$(node - "$VAPID_FILE" <<'NODE'
          const fs = require('fs');
          const pair = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          process.stdout.write(pair.publicKey);
          NODE
          )"
          VAPID_PRIVATE_KEY="$(node - "$VAPID_FILE" <<'NODE'
          const fs = require('fs');
          const pair = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          process.stdout.write(pair.privateKey);
          NODE
          )"

          printf '%s' "$VAPID_PUBLIC_KEY" | npx wrangler@4 secret put VAPID_PUBLIC_KEY --config wrangler.jsonc >/dev/null
          printf '%s' "$VAPID_PRIVATE_KEY" | npx wrangler@4 secret put VAPID_PRIVATE_KEY --config wrangler.jsonc >/dev/null
          echo "Generated and stored a persistent VAPID key pair in Cloudflare Worker secrets."

      - name: Deploy Worker
        run: npx wrangler@4 deploy --config wrangler.jsonc

      - name: Smoke test production API
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://football-v2.acchtt.workers.dev"
          TODAY="$(TZ=Asia/Ho_Chi_Minh date +%F)"

          check_json() {
            local name="$1"
            local url="$2"
            local body
            body="$(mktemp)"
            trap 'rm -f "$body"' RETURN

            for attempt in 1 2 3 4 5 6; do
              echo "Checking $name (attempt $attempt): $url"
              local status
              status="$(curl --retry 2 --retry-delay 1 --retry-all-errors -sS -o "$body" -w '%{http_code}' "$url" || true)"
              if [ "$status" -ge 200 ] 2>/dev/null && [ "$status" -lt 300 ] 2>/dev/null; then
                if python -c 'import json,sys; p=json.load(open(sys.argv[1],encoding="utf-8")); assert not (isinstance(p,dict) and p.get("ok") is False), "API returned ok=false: "+json.dumps(p)[:500]' "$body"; then
                  cat "$body"
                  echo
                  rm -f "$body"
                  trap - RETURN
                  return 0
                fi
              fi
              if [ "$attempt" -lt 6 ]; then sleep 3; fi
            done

            cat "$body" || true
            echo
            echo "::error::$name did not become healthy after deployment propagation retries"
            exit 1
          }

          check_push_ready() {
            local url="$BASE/api/push/config"
            local body
            body="$(mktemp)"
            trap 'rm -f "$body"' RETURN

            for attempt in 1 2 3 4 5 6; do
              echo "Checking Web Push readiness (attempt $attempt): $url"
              local status
              status="$(curl --retry 2 --retry-delay 1 --retry-all-errors -sS -o "$body" -w '%{http_code}' "$url" || true)"
              if [ "$status" -ge 200 ] 2>/dev/null && [ "$status" -lt 300 ] 2>/dev/null; then
                if python - "$body" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              payload = json.load(fh)
          assert payload.get("ok") is True, payload
          assert payload.get("enabled") is True, payload
          assert isinstance(payload.get("vapidPublicKey"), str) and payload["vapidPublicKey"], payload
          PY
                then
                  cat "$body"
                  echo
                  rm -f "$body"
                  trap - RETURN
                  return 0
                fi
              fi
              if [ "$attempt" -lt 6 ]; then sleep 3; fi
            done

            cat "$body" || true
            echo
            echo "::error::Web Push backend is deployed but not enabled. Verify VAPID Worker secrets."
            exit 1
          }

          check_json "BSD events" "$BASE/api/bsd/events?date_from=$TODAY&date_to=$TODAY&limit=5"
          check_json "BSD live" "$BASE/api/bsd/live"
          check_json "dashboard" "$BASE/api/dashboard-data"
          check_push_ready
