services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-football_v2}
      POSTGRES_USER: ${POSTGRES_USER:-football}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-football_local_only}
    ports:
      - "5432:5432"
    volumes:
      - football_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-football} -d ${POSTGRES_DB:-football_v2}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://football:football_local_only@db:5432/football_v2}
      APP_ENV: ${APP_ENV:-development}
      FIXTURE_PROVIDER: ${FIXTURE_PROVIDER:-demo}
      SEED_DEMO_ON_READ: ${SEED_DEMO_ON_READ:-true}
      BSD_API_TOKEN: ${BSD_API_TOKEN:-}
      BSD_BASE_URL: ${BSD_BASE_URL:-https://sports.bzzoiro.com/api/v2}
      BSD_TIMEOUT_SECONDS: ${BSD_TIMEOUT_SECONDS:-20}
      BSD_HISTORY_MATCHES: ${BSD_HISTORY_MATCHES:-10}
      BSD_LOOKBACK_DAYS: ${BSD_LOOKBACK_DAYS:-180}
      SPORTMONKS_API_TOKEN: ${SPORTMONKS_API_TOKEN:-}
      SPORTMONKS_BASE_URL: ${SPORTMONKS_BASE_URL:-https://api.sportmonks.com/v3/football}
      SPORTMONKS_TIMEOUT_SECONDS: ${SPORTMONKS_TIMEOUT_SECONDS:-20}
      SPORTMONKS_HISTORY_MATCHES: ${SPORTMONKS_HISTORY_MATCHES:-10}
      SPORTMONKS_LOOKBACK_DAYS: ${SPORTMONKS_LOOKBACK_DAYS:-180}
      RESEARCH_IMPORT_TOKEN: ${RESEARCH_IMPORT_TOKEN:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      VISION_PROVIDER: ${VISION_PROVIDER:-demo}
      VISION_MODEL: ${VISION_MODEL:-gpt-5.6}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      UPLOAD_DIR: /data/uploads
      AIRTABLE_SYNC_ENABLED: ${AIRTABLE_SYNC_ENABLED:-false}
      AIRTABLE_TOKEN: ${AIRTABLE_TOKEN:-}
      AIRTABLE_BASE_ID: ${AIRTABLE_BASE_ID:-appWyZJjitSBATXAU}
      AIRTABLE_DECISION_STATES_TABLE: ${AIRTABLE_DECISION_STATES_TABLE:-Decision States}
      AIRTABLE_TIMEOUT_SECONDS: ${AIRTABLE_TIMEOUT_SECONDS:-15}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - football_uploads:/data/uploads

  web:
    build: ./apps/web
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  football_postgres:
  football_uploads:
