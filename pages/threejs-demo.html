<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARC XI — Ambient Glass Demo</title>
<meta name="theme-color" content="#050505">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}
  .site{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050505}
  #fx{position:fixed;inset:0;z-index:3;pointer-events:none;mix-blend-mode:screen}
  #fx canvas{display:block;width:100%;height:100%;opacity:.86}
  @media(prefers-reduced-motion:reduce){#fx canvas{opacity:.74}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js"}}
</script>
</head>
<body>
<iframe class="site" src="https://acchtt.github.io/football-v2/#board" title="ARC XI schedule"></iframe>
<div id="fx" aria-hidden="true"></div>

<script type="module">
import * as THREE from 'three';

const host=document.querySelector('#fx');
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x000000,0);
renderer.outputColorSpace=THREE.SRGBColorSpace;
host.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);

const material=new THREE.ShaderMaterial({
  transparent:true,
  depthWrite:false,
  blending:THREE.AdditiveBlending,
  uniforms:{
    uTime:{value:0},
    uAspect:{value:innerWidth/innerHeight},
    uMotion:{value:reduceMotion?0:1}
  },
  vertexShader:`
    varying vec2 vUv;
    void main(){
      vUv=uv;
      gl_Position=vec4(position.xy,0.0,1.0);
    }
  `,
  fragmentShader:`
    precision highp float;
    varying vec2 vUv;
    uniform float uTime;
    uniform float uAspect;
    uniform float uMotion;

    float lineGlow(float d,float core,float glow){
      return exp(-abs(d)/core)*.65 + exp(-abs(d)/glow)*.22;
    }

    float band(float v,float a,float b,float soft){
      return smoothstep(a-soft,a,v)*(1.0-smoothstep(b,b+soft,v));
    }

    void main(){
      vec2 p=vUv*2.0-1.0;
      p.x*=uAspect;

      float t=uTime*uMotion;

      vec3 pink=vec3(1.0,.12,.48);
      vec3 hot=vec3(1.0,.32,.66);
      vec3 gold=vec3(1.0,.73,.30);
      vec3 champagne=vec3(1.0,.86,.58);

      vec3 col=vec3(0.0);

      // Edge masks: keep the schedule center almost untouched.
      float leftMask=smoothstep(-.62*uAspect,-1.02*uAspect,p.x);
      float rightMask=smoothstep(.62*uAspect,1.02*uAspect,p.x);
      float bottomMask=smoothstep(-.42,-1.02,p.y);
      float topMask=smoothstep(.52,1.02,p.y);

      // Large crystalline/refraction bands at the left edge.
      float l1=p.y-(1.34*p.x/uAspect+1.05+sin(t*.18)*.025);
      float l2=p.y-(.82*p.x/uAspect+.42+cos(t*.14)*.018);
      float l3=p.y-(-1.15*p.x/uAspect-.92);
      float leftFacet=(lineGlow(l1,.020,.13)*.95 + lineGlow(l2,.026,.17)*.64 + lineGlow(l3,.018,.11)*.45)
                    * leftMask * band(p.y,-.82,.88,.16);
      col += pink*leftFacet*.82;
      col += champagne*lineGlow(l2,.012,.075)*leftMask*.34;

      // Right edge glass: pink primary with champagne highlights.
      float r1=p.y-(-1.10*p.x/uAspect+1.02+cos(t*.16)*.022);
      float r2=p.y-(-.62*p.x/uAspect+.30);
      float r3=p.y-(1.22*p.x/uAspect-1.18);
      float rightFacet=(lineGlow(r1,.022,.14)*.82 + lineGlow(r2,.030,.18)*.58 + lineGlow(r3,.018,.12)*.42)
                     * rightMask * band(p.y,-.78,.90,.18);
      col += hot*rightFacet*.72;
      col += gold*lineGlow(r2,.014,.085)*rightMask*.30;

      // Flowing bottom light, matching the reference's pink/gold sweep.
      float x=p.x/max(uAspect,.001);
      float yPink=-.92 + .12*sin(x*2.7+t*.20) + .04*sin(x*6.2-t*.15);
      float yGold=-.82 + .10*sin(x*2.15+t*.15+1.4);
      float pinkRibbon=lineGlow(p.y-yPink,.018,.12)*bottomMask;
      float goldRibbon=lineGlow(p.y-yGold,.015,.10)*bottomMask;
      col += pink*pinkRibbon*.56;
      col += gold*goldRibbon*.34;

      // Soft ambient wash behind the edge forms.
      float leftBloom=exp(-pow((p.x/uAspect+1.02)/.28,2.0)-pow((p.y-.18)/.82,2.0));
      float rightBloom=exp(-pow((p.x/uAspect-1.02)/.30,2.0)-pow((p.y-.05)/.86,2.0));
      float bottomBloom=exp(-pow((p.y+1.02)/.26,2.0));
      col += pink*leftBloom*.09 + hot*rightBloom*.085 + pink*bottomBloom*.045;

      // Tiny top-edge shimmer, never crossing controls.
      float topArc=lineGlow(p.y-(.92+.025*sin(x*4.0+t*.12)),.009,.055)*topMask;
      col += mix(pink,champagne,.38+.22*sin(x*2.0))*topArc*.16;

      // Darken everything away from the frame.
      float frame=max(max(leftMask,rightMask),max(bottomMask,topMask));
      col*=frame;

      float alpha=clamp(max(max(col.r,col.g),col.b),0.0,.72);
      gl_FragColor=vec4(col,alpha);
    }
  `
});

const quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),material);
scene.add(quad);

function layout(){
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));
  material.uniforms.uAspect.value=innerWidth/innerHeight;
}
layout();
addEventListener('resize',layout);

let visible=true;
document.addEventListener('visibilitychange',()=>visible=!document.hidden);
const clock=new THREE.Clock();

function frame(){
  requestAnimationFrame(frame);
  if(!visible)return;
  material.uniforms.uTime.value=clock.getElapsedTime();
  renderer.render(scene,camera);
}
frame();
</script>
</body>
</html>
