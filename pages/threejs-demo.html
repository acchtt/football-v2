<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARC XI — Glass Emblem Three.js Demo</title>
<meta name="theme-color" content="#050505">
<style>
  :root{--yellow:#f3e72b;--pink:#f13c91;--bg:#050505}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .site{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
  .demoTag{
    position:fixed;right:22px;bottom:20px;z-index:6;display:flex;align-items:center;gap:9px;
    padding:8px 11px;border:1px solid rgba(255,255,255,.11);border-radius:999px;
    background:rgba(5,5,5,.62);backdrop-filter:blur(12px);color:#d9d6cf;
    font-size:10px;letter-spacing:.08em;text-transform:uppercase
  }
  .demoTag i{width:7px;height:7px;border-radius:50%;background:var(--pink);box-shadow:0 0 12px rgba(241,60,145,.6)}
  .demoTag button{
    appearance:none;border:0;background:transparent;color:#8d8a84;font:inherit;font-size:10px;cursor:pointer;padding:0 0 0 4px
  }
  .demoTag button:hover{color:#fff}
  @media(max-width:720px){.demoTag{right:10px;bottom:10px;font-size:9px}}
  @media(prefers-reduced-motion:reduce){.demoTag i{box-shadow:none}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}
</script>
</head>
<body>
<iframe class="site" src="https://acchtt.github.io/football-v2/#board" title="ARC XI schedule"></iframe>
<div id="fx" aria-hidden="true"></div>
<div class="demoTag"><i></i><span>Glass emblem demo</span><button id="toggle" type="button">hide</button></div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const root=document.querySelector('#fx');
const toggle=document.querySelector('#toggle');
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x000000,0);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
root.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),.05).texture;
pmrem.dispose();
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);
camera.position.set(0,0,9);

const group=new THREE.Group();
scene.add(group);

function starShape(){
  const shape=new THREE.Shape();
  const outer=1,inner=.43,points=5;
  for(let i=0;i<points*2;i++){
    const r=i%2===0?outer:inner;
    const a=-Math.PI/2+i*Math.PI/points;
    const x=Math.cos(a)*r,y=Math.sin(a)*r;
    if(i===0)shape.moveTo(x,y);else shape.lineTo(x,y);
  }
  shape.closePath();
  return shape;
}

const glass=new THREE.MeshPhysicalMaterial({
  color:0xff378f,
  metalness:.02,
  roughness:.06,
  transmission:.78,
  thickness:1.4,
  ior:1.48,
  clearcoat:1,
  clearcoatRoughness:.025,
  emissive:0x250714,
  emissiveIntensity:.16,
  transparent:true,
  opacity:1,
  side:THREE.DoubleSide
});
const starGeometry=new THREE.ExtrudeGeometry(starShape(),{
  depth:.42,bevelEnabled:true,bevelSegments:6,steps:1,bevelSize:.075,bevelThickness:.07
});
starGeometry.center();
const star=new THREE.Mesh(starGeometry,glass);
star.rotation.set(.18,.28,-.11);
group.add(star);

const starEdges=new THREE.LineSegments(
  new THREE.EdgesGeometry(starGeometry,22),
  new THREE.LineBasicMaterial({color:0xff8dc3,transparent:true,opacity:.72,blending:THREE.AdditiveBlending})
);
starEdges.rotation.copy(star.rotation);
group.add(starEdges);

const gold=new THREE.MeshPhysicalMaterial({
  color:0xffdf72,
  metalness:.72,
  roughness:.13,
  clearcoat:1,
  clearcoatRoughness:.04,
  emissive:0x6b4a00,
  emissiveIntensity:.34
});
const slash=new THREE.Mesh(new THREE.BoxGeometry(.13,2.38,.13),gold);
slash.rotation.z=-.76;
slash.position.set(.38,.18,.21);
group.add(slash);

const slashEdge=new THREE.LineSegments(
  new THREE.EdgesGeometry(slash.geometry),
  new THREE.LineBasicMaterial({color:0xfff0ae,transparent:true,opacity:.5})
);
slashEdge.rotation.copy(slash.rotation);
slashEdge.position.copy(slash.position);
group.add(slashEdge);

scene.add(new THREE.AmbientLight(0xffffff,.72));

const pinkKey=new THREE.PointLight(0xf13c91,24,10,2);
pinkKey.position.set(-2.2,1.8,4.5);scene.add(pinkKey);
const yellowKey=new THREE.PointLight(0xffdf72,34,11,2);
yellowKey.position.set(2.3,.8,4.2);scene.add(yellowKey);
const whiteRim=new THREE.PointLight(0xffffff,28,10,2);
whiteRim.position.set(-.2,2.8,4.8);scene.add(whiteRim);

let baseY=2.14;
function place(){
  const narrow=innerWidth<850;
  group.scale.setScalar(narrow?.31:.42);
  group.position.set(
    narrow?-2.72:-4.48,
    narrow?1.93:2.22,
    0
  );
  baseY=group.position.y;
}
place();

let mx=0,my=0,hidden=false,visible=true;
addEventListener('pointermove',e=>{
  mx=(e.clientX/innerWidth-.5)*2;
  my=(e.clientY/innerHeight-.5)*2;
},{passive:true});
addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  place();
});
document.addEventListener('visibilitychange',()=>visible=!document.hidden);

toggle.addEventListener('click',()=>{
  hidden=!hidden;
  root.style.display=hidden?'none':'block';
  toggle.textContent=hidden?'show':'hide';
});

const clock=new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  if(!visible||hidden)return;
  const t=clock.getElapsedTime();
  const targetY=reduceMotion?-.12:-.12+mx*.12;
  const targetX=reduceMotion?.10:.10-my*.06;
  group.rotation.y+=(targetY-group.rotation.y)*.045;
  group.rotation.x+=(targetX-group.rotation.x)*.045;
  if(!reduceMotion){
    group.position.y+=(baseY+Math.sin(t*.58)*.018-group.position.y)*.05;
  }
  renderer.render(scene,camera);
}
frame();
</script>
</body>
</html>
