<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARC XI — Ambient Glass Demo</title>
<meta name="theme-color" content="#050505">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}
  .site{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050505}
  #fx{position:fixed;inset:0;z-index:3;pointer-events:none;mix-blend-mode:screen}
  #fx canvas{display:block;width:100%;height:100%;opacity:.72}
  @media(prefers-reduced-motion:reduce){#fx canvas{opacity:.58}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}
</script>
</head>
<body>
<iframe class="site" src="https://acchtt.github.io/football-v2/#board" title="ARC XI schedule"></iframe>
<div id="fx" aria-hidden="true"></div>

<script type="module">
import * as THREE from 'three';

const host=document.querySelector('#fx');
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x000000,0);
renderer.outputColorSpace=THREE.SRGBColorSpace;
host.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-5,5,3,-3,.1,20);
camera.position.z=10;

const vertex=`
  varying vec2 vUv;
  void main(){
    vUv=uv;
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
  }
`;

const fragment=`
  uniform vec3 uColor;
  uniform float uAlpha;
  uniform float uPhase;
  uniform float uTime;
  varying vec2 vUv;
  void main(){
    float edge=min(min(vUv.x,1.0-vUv.x),min(vUv.y,1.0-vUv.y));
    float rim=1.0-smoothstep(0.0,.16,edge);
    float sweep=pow(max(0.0,1.0-abs((vUv.x+vUv.y*.55)-(.55+sin(uTime*.16+uPhase)*.08))),7.0);
    float core=.22+.22*(1.0-vUv.y);
    float alpha=uAlpha*(core+rim*.78+sweep*.65);
    gl_FragColor=vec4(uColor,alpha);
  }
`;

function makeShard(points,color,alpha,phase){
  const shape=new THREE.Shape();
  points.forEach((p,i)=>i?shape.lineTo(p[0],p[1]):shape.moveTo(p[0],p[1]));
  shape.closePath();
  const geometry=new THREE.ShapeGeometry(shape);
  const material=new THREE.ShaderMaterial({
    uniforms:{
      uColor:{value:new THREE.Color(color)},
      uAlpha:{value:alpha},
      uPhase:{value:phase},
      uTime:{value:0}
    },
    vertexShader:vertex,fragmentShader:fragment,
    transparent:true,depthWrite:false,side:THREE.DoubleSide,
    blending:THREE.AdditiveBlending
  });
  const mesh=new THREE.Mesh(geometry,material);
  mesh.userData={phase,baseX:0,baseY:0};
  return mesh;
}

const group=new THREE.Group();scene.add(group);

// Irregular crystalline facets, deliberately outside the content canvas.
const shards=[
  {pts:[[-.25,-.95],[.72,-.45],[.28,.96],[-.52,.35]],c:0xf13c91,a:.22,p:.1,x:-5.22,y:2.18,r:-.46,s:1.15},
  {pts:[[-.5,-.72],[.5,-.22],[.18,.76],[-.72,.18]],c:0xe7c36a,a:.13,p:.8,x:-4.85,y:2.56,r:-.18,s:.82},
  {pts:[[-.34,-.86],[.62,-.36],[.34,.88],[-.54,.34]],c:0xf13c91,a:.19,p:1.5,x:5.18,y:2.28,r:.52,s:1.02},
  {pts:[[-.45,-.64],[.48,-.28],[.18,.72],[-.66,.22]],c:0xe7c36a,a:.12,p:2.2,x:4.92,y:2.62,r:.22,s:.74},
  {pts:[[-.4,-.72],[.55,-.28],[.2,.7],[-.62,.22]],c:0xf13c91,a:.12,p:2.9,x:-5.18,y:-2.55,r:.44,s:.8}
];

shards.forEach(s=>{
  const m=makeShard(s.pts,s.c,s.a,s.p);
  m.position.set(s.x,s.y,0);
  m.rotation.z=s.r;
  m.scale.setScalar(s.s);
  m.userData.baseX=s.x;m.userData.baseY=s.y;
  group.add(m);
});

// Soft bloom-like pools made from additive radial sprites.
function glowTexture(){
  const canvas=document.createElement('canvas');canvas.width=256;canvas.height=256;
  const ctx=canvas.getContext('2d');
  const g=ctx.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0,'rgba(255,255,255,.55)');
  g.addColorStop(.18,'rgba(255,255,255,.18)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(canvas);
}
const glow=glowTexture();
[
  {x:-5.0,y:2.45,c:0xf13c91,s:2.2,a:.12},
  {x:5.0,y:2.5,c:0xe7c36a,s:2.0,a:.09},
  {x:-5.1,y:-2.6,c:0xf13c91,s:1.7,a:.07}
].forEach(g=>{
  const sprite=new THREE.Sprite(new THREE.SpriteMaterial({
    map:glow,color:g.c,transparent:true,opacity:g.a,depthWrite:false,blending:THREE.AdditiveBlending
  }));
  sprite.position.set(g.x,g.y,-.2);sprite.scale.set(g.s,g.s,1);group.add(sprite);
});

function layout(){
  const aspect=innerWidth/innerHeight;
  camera.left=-3*aspect;camera.right=3*aspect;camera.top=3;camera.bottom=-3;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));
}
layout();addEventListener('resize',layout);

let visible=true;document.addEventListener('visibilitychange',()=>visible=!document.hidden);
const clock=new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  if(!visible)return;
  const t=clock.getElapsedTime();
  group.children.forEach((o,i)=>{
    if(o.material?.uniforms?.uTime)o.material.uniforms.uTime.value=t;
    if(!reduceMotion&&o.userData?.baseX!==undefined){
      o.position.x=o.userData.baseX+Math.sin(t*.12+o.userData.phase)*.018;
      o.position.y=o.userData.baseY+Math.cos(t*.1+o.userData.phase)*.012;
    }
  });
  renderer.render(scene,camera);
}
frame();
</script>
</body>
</html>
