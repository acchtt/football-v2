<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARC XI — Ambient Glass Demo</title>
<meta name="theme-color" content="#050505">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}
  .site{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050505}
  #fx{position:fixed;inset:0;z-index:3;pointer-events:none;mix-blend-mode:screen}
  #fx canvas{display:block;width:100%;height:100%;opacity:.92}
  @media(prefers-reduced-motion:reduce){#fx canvas{opacity:.82}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js"}}
</script>
</head>
<body>
<iframe class="site" src="https://acchtt.github.io/football-v2/#board" title="ARC XI schedule"></iframe>
<div id="fx" aria-hidden="true"></div>

<script type="module">
import * as THREE from 'three';

const host=document.querySelector('#fx');
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x000000,0);
renderer.outputColorSpace=THREE.SRGBColorSpace;
host.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);

const material=new THREE.ShaderMaterial({
  transparent:true,
  depthWrite:false,
  blending:THREE.AdditiveBlending,
  uniforms:{
    uTime:{value:0},
    uAspect:{value:innerWidth/innerHeight},
    uMotion:{value:reduceMotion?0:1}
  },
  vertexShader:`
    varying vec2 vUv;
    void main(){
      vUv=uv;
      gl_Position=vec4(position.xy,0.0,1.0);
    }
  `,
  fragmentShader:`
    precision highp float;
    varying vec2 vUv;
    uniform float uTime;
    uniform float uAspect;
    uniform float uMotion;

    float cross2(vec2 a,vec2 b){return a.x*b.y-a.y*b.x;}
    float sideDist(vec2 p,vec2 a,vec2 b){
      vec2 e=b-a;
      return cross2(e,p-a)/max(length(e),.0001);
    }
    float triField(vec2 p,vec2 a,vec2 b,vec2 c){
      float s=sign(cross2(b-a,c-a));
      return min(min(s*sideDist(p,a,b),s*sideDist(p,b,c)),s*sideDist(p,c,a));
    }
    float lineGlow(float d,float core,float glow){
      return exp(-abs(d)/core)*.72 + exp(-abs(d)/glow)*.28;
    }
    float softDot(vec2 p,vec2 c,float r){
      float d=length(p-c);
      return exp(-d*d/(r*r));
    }

    void main(){
      vec2 uv=vUv;
      float t=uTime*uMotion;

      vec3 pink=vec3(1.0,.11,.47);
      vec3 hot=vec3(1.0,.34,.67);
      vec3 gold=vec3(1.0,.69,.24);
      vec3 champagne=vec3(1.0,.86,.62);
      vec3 col=vec3(0.0);

      // Reference C: large translucent crystalline forms at both outer edges.
      float lf1=triField(uv,vec2(-.03,.22),vec2(.075,.78),vec2(.165,.48));
      float lf2=triField(uv,vec2(-.02,.10),vec2(.11,.57),vec2(.19,.28));
      float lf3=triField(uv,vec2(.045,.66),vec2(.12,.98),vec2(.17,.56));
      float lm1=smoothstep(-.015,.020,lf1);
      float lm2=smoothstep(-.015,.020,lf2);
      float lm3=smoothstep(-.015,.018,lf3);
      col+=pink*(lm1*.095+lm2*.075+lm3*.085);
      col+=hot*(lineGlow(lf1,.006,.027)*.28+lineGlow(lf2,.006,.024)*.22+lineGlow(lf3,.005,.020)*.30);
      col+=champagne*lineGlow(lf2-.035,.005,.020)*.11;

      float rf1=triField(uv,vec2(1.03,.20),vec2(.925,.82),vec2(.835,.58));
      float rf2=triField(uv,vec2(1.02,.08),vec2(.91,.62),vec2(.84,.43));
      float rf3=triField(uv,vec2(.97,.68),vec2(.89,.98),vec2(.84,.60));
      float rm1=smoothstep(-.015,.020,rf1);
      float rm2=smoothstep(-.015,.020,rf2);
      float rm3=smoothstep(-.015,.018,rf3);
      col+=hot*(rm1*.085+rm3*.075);
      col+=gold*rm2*.075;
      col+=pink*(lineGlow(rf1,.006,.027)*.24+lineGlow(rf3,.005,.021)*.28);
      col+=champagne*lineGlow(rf2,.006,.025)*.23;

      // Stronger lower refraction sweep from the chosen reference.
      float x=uv.x;
      float y1=.055+.055*sin(x*6.1+t*.18)+.020*sin(x*14.0-t*.10);
      float y2=.105+.046*sin(x*5.0+t*.14+1.2);
      float y3=.018+.034*sin(x*7.6-t*.12+2.0);
      float bottomMask=1.0-smoothstep(.05,.34,uv.y);
      col+=pink*lineGlow(uv.y-y1,.009,.060)*bottomMask*.52;
      col+=gold*lineGlow(uv.y-y2,.007,.052)*bottomMask*.28;
      col+=hot*lineGlow(uv.y-y3,.012,.075)*bottomMask*.20;

      // Soft magenta atmosphere rising from the lower corners.
      float lb=softDot(uv,vec2(.08,.07),.23);
      float rb=softDot(uv,vec2(.92,.08),.26);
      col+=pink*(lb*.075+rb*.065);

      // Dim bokeh accents along the bottom edge, like the reference.
      float dots=0.0;
      dots+=softDot(uv,vec2(.20,.10),.020);
      dots+=softDot(uv,vec2(.27,.075),.014);
      dots+=softDot(uv,vec2(.36,.11),.023);
      dots+=softDot(uv,vec2(.46,.075),.017);
      dots+=softDot(uv,vec2(.62,.095),.021);
      dots+=softDot(uv,vec2(.73,.07),.015);
      col+=mix(pink,champagne,.34)*dots*.20;

      // Faint top corner wash only; keep navigation readable.
      col+=pink*softDot(uv,vec2(.02,.88),.18)*.045;
      col+=gold*softDot(uv,vec2(.98,.88),.18)*.040;

      float alpha=clamp(max(max(col.r,col.g),col.b),0.0,.80);
      gl_FragColor=vec4(col,alpha);
    }
  `
});

const quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),material);
scene.add(quad);

function layout(){
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));
  material.uniforms.uAspect.value=innerWidth/innerHeight;
}
layout();
addEventListener('resize',layout);

let visible=true;
document.addEventListener('visibilitychange',()=>visible=!document.hidden);
const clock=new THREE.Clock();

function frame(){
  requestAnimationFrame(frame);
  if(!visible)return;
  material.uniforms.uTime.value=clock.getElapsedTime();
  renderer.render(scene,camera);
}
frame();
</script>
</body>
</html>
