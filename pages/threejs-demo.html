<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARC XI — Ambient Glass Demo</title>
<meta name="theme-color" content="#050505">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}
  .site{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050505}
  #fx{position:fixed;inset:0;z-index:3;pointer-events:none;mix-blend-mode:screen}
  #fx canvas{display:block;width:100%;height:100%;opacity:.72}
  @media(prefers-reduced-motion:reduce){#fx canvas{opacity:.58}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}
</script>
</head>
<body>
<iframe class="site" src="https://acchtt.github.io/football-v2/#board" title="ARC XI schedule"></iframe>
<div id="fx" aria-hidden="true"></div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const host=document.querySelector('#fx');
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x000000,0);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.92;
host.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-5,5,3,-3,.1,30);
camera.position.z=10;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),.03).texture;
pmrem.dispose();

scene.add(new THREE.AmbientLight(0xffffff,.38));
const pinkLight=new THREE.PointLight(0xf13c91,12,10,2);
pinkLight.position.set(-4,2.5,4);scene.add(pinkLight);
const goldLight=new THREE.PointLight(0xe7c36a,10,10,2);
goldLight.position.set(4.4,2.1,3.5);scene.add(goldLight);

const pink=new THREE.MeshPhysicalMaterial({
  color:0xff4da1,metalness:.02,roughness:.12,transmission:.58,thickness:.65,ior:1.43,
  clearcoat:1,clearcoatRoughness:.08,transparent:true,opacity:.42,side:THREE.DoubleSide,depthWrite:false
});
const gold=new THREE.MeshPhysicalMaterial({
  color:0xf1cb73,metalness:.08,roughness:.16,transmission:.42,thickness:.5,ior:1.4,
  clearcoat:1,clearcoatRoughness:.1,transparent:true,opacity:.3,side:THREE.DoubleSide,depthWrite:false
});
const edgePink=new THREE.LineBasicMaterial({color:0xff9bc9,transparent:true,opacity:.34,blending:THREE.AdditiveBlending});
const edgeGold=new THREE.LineBasicMaterial({color:0xffe0a0,transparent:true,opacity:.24,blending:THREE.AdditiveBlending});

const group=new THREE.Group();scene.add(group);
const specs=[
  {x:-5.15,y:2.45,w:1.55,h:.34,r:-.74,z:.08,m:pink,e:edgePink,phase:.2},
  {x:-4.78,y:1.92,w:1.05,h:.2,r:-.54,z:.02,m:gold,e:edgeGold,phase:.9},
  {x:5.03,y:2.30,w:1.42,h:.28,r:.72,z:.04,m:gold,e:edgeGold,phase:1.6},
  {x:5.22,y:1.72,w:1.18,h:.22,r:.58,z:.02,m:pink,e:edgePink,phase:2.1},
  {x:-5.10,y:-2.42,w:1.22,h:.2,r:.56,z:.01,m:pink,e:edgePink,phase:2.8}
];

function shard(s){
  const geometry=new THREE.PlaneGeometry(s.w,s.h,1,1);
  const mesh=new THREE.Mesh(geometry,s.m);
  mesh.position.set(s.x,s.y,s.z);
  mesh.rotation.z=s.r;
  mesh.rotation.x=.22;
  mesh.rotation.y=s.r>0?-.34:.34;
  mesh.userData={baseX:s.x,baseY:s.y,phase:s.phase};

  const edges=new THREE.LineSegments(new THREE.EdgesGeometry(geometry),s.e);
  edges.position.copy(mesh.position);
  edges.rotation.copy(mesh.rotation);
  edges.userData={baseX:s.x,baseY:s.y,phase:s.phase+0.4};
  group.add(mesh,edges);
}
specs.forEach(shard);

function layout(){
  const aspect=innerWidth/innerHeight;
  camera.left=-3*aspect;camera.right=3*aspect;camera.top=3;camera.bottom=-3;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));
}
layout();addEventListener('resize',layout);

let visible=true;document.addEventListener('visibilitychange',()=>visible=!document.hidden);
const clock=new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  if(!visible)return;
  const t=clock.getElapsedTime();
  if(!reduceMotion){
    group.children.forEach((o,i)=>{
      const d=o.userData;
      if(!d)return;
      o.position.x=d.baseX+Math.sin(t*.16+d.phase)*.035;
      o.position.y=d.baseY+Math.cos(t*.13+d.phase)*.022;
    });
    pinkLight.intensity=11.4+Math.sin(t*.3)*.8;
    goldLight.intensity=9.5+Math.cos(t*.26)*.7;
  }
  renderer.render(scene,camera);
}
frame();
</script>
</body>
</html>
