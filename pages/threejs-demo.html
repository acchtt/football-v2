<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARC XI — Ambient Glass Demo</title>
<meta name="theme-color" content="#050505">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}
  .site{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050505}
  #fx{position:fixed;inset:0;z-index:3;pointer-events:none;mix-blend-mode:screen}
  #fx canvas{display:block;width:100%;height:100%;opacity:.96}
  @media(prefers-reduced-motion:reduce){#fx canvas{opacity:.88}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js"}}
</script>
</head>
<body>
<iframe class="site" src="https://acchtt.github.io/football-v2/#board" title="ARC XI schedule"></iframe>
<div id="fx" aria-hidden="true"></div>

<script type="module">
import * as THREE from 'three';

const host=document.querySelector('#fx');
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x000000,0);
renderer.outputColorSpace=THREE.SRGBColorSpace;
host.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);

const material=new THREE.ShaderMaterial({
  transparent:true,
  depthWrite:false,
  blending:THREE.AdditiveBlending,
  uniforms:{
    uTime:{value:0},
    uMotion:{value:reduceMotion?0:1}
  },
  vertexShader:`
    varying vec2 vUv;
    void main(){
      vUv=uv;
      gl_Position=vec4(position.xy,0.0,1.0);
    }
  `,
  fragmentShader:`
    precision highp float;
    varying vec2 vUv;
    uniform float uTime;
    uniform float uMotion;

    float cross2(vec2 a,vec2 b){return a.x*b.y-a.y*b.x;}
    float sdLine(vec2 p,vec2 a,vec2 b){
      vec2 pa=p-a, ba=b-a;
      float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0);
      return length(pa-ba*h);
    }
    float triMask(vec2 p,vec2 a,vec2 b,vec2 c,float feather){
      float c1=cross2(b-a,p-a);
      float c2=cross2(c-b,p-b);
      float c3=cross2(a-c,p-c);
      float pos=min(min(c1,c2),c3);
      float neg=max(max(c1,c2),c3);
      float d=max(-pos,neg);
      float inside=step(0.0,min(min(c1,c2),c3))+step(max(max(c1,c2),c3),0.0);
      float edge=min(min(sdLine(p,a,b),sdLine(p,b,c)),sdLine(p,c,a));
      return max(smoothstep(feather,0.0,edge)*.0,clamp(inside,0.0,1.0));
    }
    float inTri(vec2 p,vec2 a,vec2 b,vec2 c){
      float s1=cross2(b-a,p-a);
      float s2=cross2(c-b,p-b);
      float s3=cross2(a-c,p-c);
      bool neg=(s1<0.0)||(s2<0.0)||(s3<0.0);
      bool pos=(s1>0.0)||(s2>0.0)||(s3>0.0);
      return (neg&&pos)?0.0:1.0;
    }
    float edgeGlowTri(vec2 p,vec2 a,vec2 b,vec2 c,float w){
      float d=min(min(sdLine(p,a,b),sdLine(p,b,c)),sdLine(p,c,a));
      return exp(-d/w);
    }
    float softDot(vec2 p,vec2 c,float r){
      vec2 q=(p-c)/r;
      return exp(-dot(q,q)*2.6);
    }
    float lineGlow(float d,float core,float glow){
      return exp(-abs(d)/core)*.74+exp(-abs(d)/glow)*.26;
    }

    void main(){
      vec2 uv=vUv;
      float t=uTime*uMotion;
      vec3 pink=vec3(1.0,.10,.47);
      vec3 hot=vec3(1.0,.32,.66);
      vec3 gold=vec3(1.0,.69,.24);
      vec3 champagne=vec3(1.0,.88,.66);
      vec3 whitePink=vec3(1.0,.74,.88);
      vec3 col=vec3(0.0);

      // LEFT CLUSTER — large filled shards, matching Concept C's top-left placement.
      vec2 la=vec2(-.02,.99), lb=vec2(.075,.72), lc=vec2(.105,.93);
      vec2 ld=vec2(.045,.75), le=vec2(.125,.46), lf=vec2(.155,.82);
      vec2 lg=vec2(-.02,.64), lh=vec2(.105,.54), li=vec2(.045,.34);
      float L1=inTri(uv,la,lb,lc);
      float L2=inTri(uv,ld,le,lf);
      float L3=inTri(uv,lg,lh,li);
      col+=pink*L1*.20 + hot*L2*.18 + pink*L3*.12;
      col+=whitePink*edgeGlowTri(uv,la,lb,lc,.006)*.46;
      col+=hot*edgeGlowTri(uv,ld,le,lf,.007)*.38;
      col+=champagne*edgeGlowTri(uv,lg,lh,li,.008)*.18;
      // Internal refraction cuts.
      col+=whitePink*lineGlow(sdLine(uv,vec2(.018,.91),vec2(.104,.73)),.004,.020)*.22;
      col+=hot*lineGlow(sdLine(uv,vec2(.071,.71),vec2(.143,.51)),.004,.018)*.24;

      // RIGHT CLUSTER — larger and more gold/pink mixed, like the reference.
      vec2 ra=vec2(1.02,.98), rb=vec2(.925,.74), rc=vec2(.885,.95);
      vec2 rd=vec2(.985,.82), re=vec2(.895,.49), rf=vec2(.845,.86);
      vec2 rg=vec2(1.02,.66), rh=vec2(.905,.57), ri=vec2(.955,.35);
      float R1=inTri(uv,ra,rb,rc);
      float R2=inTri(uv,rd,re,rf);
      float R3=inTri(uv,rg,rh,ri);
      col+=hot*R1*.17 + gold*R2*.15 + pink*R3*.13;
      col+=whitePink*edgeGlowTri(uv,ra,rb,rc,.006)*.40;
      col+=champagne*edgeGlowTri(uv,rd,re,rf,.007)*.36;
      col+=hot*edgeGlowTri(uv,rg,rh,ri,.008)*.28;
      col+=champagne*lineGlow(sdLine(uv,vec2(.978,.88),vec2(.894,.56)),.004,.018)*.26;
      col+=hot*lineGlow(sdLine(uv,vec2(.915,.74),vec2(.965,.40)),.004,.020)*.25;

      // Broad bottom light ribbons — brighter and wider, but still behind the schedule.
      float x=uv.x;
      float yp=.075+.034*sin(x*5.0+t*.16)+.012*sin(x*12.0-t*.10);
      float yg=.115+.028*sin(x*4.0+t*.13+1.1);
      float yp2=.025+.024*sin(x*6.6-t*.12+2.0);
      float bottom=1.0-smoothstep(.02,.28,uv.y);
      col+=pink*lineGlow(uv.y-yp,.010,.075)*bottom*.66;
      col+=gold*lineGlow(uv.y-yg,.008,.058)*bottom*.40;
      col+=hot*lineGlow(uv.y-yp2,.012,.085)*bottom*.30;

      // Bokeh / soft glass glow in the lower left and middle.
      float b=0.0;
      b+=softDot(uv,vec2(.16,.105),.040);
      b+=softDot(uv,vec2(.205,.078),.022);
      b+=softDot(uv,vec2(.262,.120),.032);
      b+=softDot(uv,vec2(.318,.083),.018);
      b+=softDot(uv,vec2(.380,.112),.026);
      b+=softDot(uv,vec2(.445,.075),.020);
      b+=softDot(uv,vec2(.520,.102),.027);
      col+=mix(pink,champagne,.28)*b*.26;

      // Soft atmospheric glow around both shard clusters.
      col+=pink*softDot(uv,vec2(.055,.72),.18)*.065;
      col+=hot*softDot(uv,vec2(.945,.70),.20)*.060;
      col+=gold*softDot(uv,vec2(.900,.55),.18)*.035;

      // Keep the central interface nearly untouched.
      float centerX=smoothstep(.18,.31,uv.x)*(1.0-smoothstep(.69,.82,uv.x));
      float centerY=smoothstep(.18,.34,uv.y);
      float protect=centerX*centerY;
      col*=mix(1.0,.18,protect);

      float alpha=clamp(max(max(col.r,col.g),col.b)*1.7,0.0,.92);
      gl_FragColor=vec4(col,alpha);
    }
  `
});

scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),material));

function layout(){
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));
}
layout();
addEventListener('resize',layout);

let visible=true;
document.addEventListener('visibilitychange',()=>visible=!document.hidden);
const clock=new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  if(!visible)return;
  material.uniforms.uTime.value=clock.getElapsedTime();
  renderer.render(scene,camera);
}
frame();
</script>
</body>
</html>
