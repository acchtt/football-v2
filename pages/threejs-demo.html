<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARC XI — Ambient Glass Demo</title>
<meta name="theme-color" content="#050505">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}
  .site{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050505}
  #fx{position:fixed;inset:0;z-index:3;pointer-events:none}
  #fx canvas{display:block;width:100%;height:100%;opacity:1}
  @media(prefers-reduced-motion:reduce){#fx canvas{opacity:.96}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js"}}
</script>
</head>
<body>
<iframe class="site" src="https://acchtt.github.io/football-v2/#board" title="ARC XI schedule"></iframe>
<div id="fx" aria-hidden="true"></div>

<script type="module">
import * as THREE from 'three';

const host=document.querySelector('#fx');
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x000000,0);
renderer.outputColorSpace=THREE.SRGBColorSpace;
host.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);

const texture=await new THREE.TextureLoader().loadAsync('./media/arcxi/concept-c-reference-effect.webp?v=1');
texture.colorSpace=THREE.SRGBColorSpace;
texture.minFilter=THREE.LinearFilter;
texture.magFilter=THREE.LinearFilter;

const material=new THREE.MeshBasicMaterial({
  map:texture,
  transparent:true,
  depthWrite:false,
  opacity:.96,
  blending:THREE.NormalBlending
});

const plane=new THREE.Mesh(new THREE.PlaneGeometry(2.06,2.06),material);
scene.add(plane);

function layout(){
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));
}
layout();
addEventListener('resize',layout);

let visible=true;
document.addEventListener('visibilitychange',()=>visible=!document.hidden);

const clock=new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  if(!visible)return;
  const t=clock.getElapsedTime();
  if(!reduceMotion){
    plane.position.x=Math.sin(t*.10)*.006;
    plane.position.y=Math.cos(t*.085)*.004;
    const s=1.03+Math.sin(t*.07)*.004;
    plane.scale.setScalar(s);
  }
  renderer.render(scene,camera);
}
frame();
</script>
</body>
</html>
