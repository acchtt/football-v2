<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARC XI — Ambient Glass Demo</title>
<meta name="theme-color" content="#050505">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}
  .site{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050505}
  #fx{position:fixed;inset:0;z-index:3;overflow:hidden;pointer-events:none}
  #fx canvas,.fx-static{position:absolute;inset:0;display:block;width:100%;height:100%}
  .fx-static{object-fit:fill;opacity:.94}
  #fx canvas{opacity:0}
  #fx.is-animated canvas{opacity:1}
  #fx.is-animated .fx-static{opacity:0}
  .fx-corner{display:none;position:absolute;background-image:url('./media/arcxi/reference-effect-hd.webp?v=1');background-repeat:no-repeat;pointer-events:none}
  /* Use the actual reference image, cropped to each edge, instead of scaling a wide image over a tall viewport. */
  @media(max-width:900px),(max-aspect-ratio:5/4),(min-aspect-ratio:21/9){
    .fx-static,#fx canvas{display:none}
    .fx-corner{display:block}
    .fx-corner--top{top:0;left:0;width:clamp(150px,22vw,340px);aspect-ratio:5/6;background-size:500% auto;background-position:left top;opacity:.9}
    .fx-corner--bottom{right:0;bottom:0;width:clamp(210px,34vw,560px);aspect-ratio:6/5;background-size:313% auto;background-position:right bottom;opacity:.8}
  }
  @media(max-width:560px){
    .fx-corner--top{width:min(39vw,190px);opacity:.75}
    .fx-corner--bottom{width:min(55vw,240px);opacity:.48}
  }

  /* Concept C: edge-only editorial light, with the center deliberately clear. */
  #fx::before,#fx::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;mix-blend-mode:screen}
  #fx::before{
    background:
      radial-gradient(ellipse 36vw 47vh at -3% -2%,rgba(249,94,167,.30),transparent 77%),
      radial-gradient(ellipse 31vw 40vh at 104% -5%,rgba(241,182,149,.27),transparent 76%),
      radial-gradient(ellipse 48vw 28vh at 15% 108%,rgba(238,102,161,.20),transparent 79%),
      radial-gradient(ellipse 39vw 34vh at 97% 103%,rgba(235,157,115,.23),transparent 79%);
    filter:blur(12px);opacity:1;animation:atmosphere-breathe 18s ease-in-out infinite alternate
  }
  #fx::after{
    background:radial-gradient(ellipse 50vw 16vh at 58% 112%,rgba(245,162,130,.17),transparent 82%);
    filter:blur(18px);opacity:.85;animation:atmosphere-drift 23s ease-in-out infinite alternate
  }
  .fx-static,#fx canvas,.fx-corner{filter:brightness(1.13) saturate(1.14) drop-shadow(0 0 14px rgba(239,85,153,.12))}
  .fx-static,#fx canvas{z-index:1}
  .fx-corner{z-index:1}
  #fx.show-before::before,#fx.show-before::after{opacity:0;animation:none}
  #fx.show-before .fx-static,#fx.show-before canvas,#fx.show-before .fx-corner{filter:none}
  #fx.no-motion::before,#fx.no-motion::after{animation:none}
  @keyframes atmosphere-breathe{from{opacity:.72;transform:translate3d(-9px,5px,0)}to{opacity:1;transform:translate3d(9px,-7px,0)}}
  @keyframes atmosphere-drift{from{opacity:.45;transform:translate3d(-12px,0,0)}to{opacity:.9;transform:translate3d(14px,-6px,0)}}
  /* This control exists only on the standalone comparison demo. */
  #compare{position:fixed;left:18px;bottom:18px;z-index:10;min-height:35px;padding:8px 13px;border:1px solid rgba(245,170,195,.42);border-radius:999px;background:rgba(15,12,17,.88);color:#f3dfeb;font:600 11px/1.2 system-ui,sans-serif;letter-spacing:.06em;cursor:pointer;backdrop-filter:blur(8px)}
  #compare:hover{border-color:#f9a4c9;background:#20141c}
  #compare:focus-visible{outline:2px solid #fff000;outline-offset:3px}
  @media(prefers-reduced-motion:reduce){#fx::before,#fx::after{animation:none}}
  @media(max-width:900px),(max-aspect-ratio:5/4),(min-aspect-ratio:21/9){
    #fx::before{background:radial-gradient(ellipse 46vw 35vh at 0% 0%,rgba(249,94,167,.22),transparent 77%),radial-gradient(ellipse 55vw 26vh at 100% 100%,rgba(235,157,115,.16),transparent 76%)}
    #fx::after{opacity:.3}
    #compare{left:10px;bottom:10px;padding:8px 10px;font-size:10px}
  }
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js"}}
</script>
</head>
<body>
<iframe class="site" src="https://acchtt.github.io/football-v2/#board" title="ARC XI schedule"></iframe>
<div id="fx" aria-hidden="true">
  <img class="fx-static" src="./media/arcxi/reference-effect-hd.webp?v=1" alt="" decoding="async">
  <div class="fx-corner fx-corner--top"></div>
  <div class="fx-corner fx-corner--bottom"></div>
</div>
<button id="compare" type="button" aria-pressed="true" aria-label="Compare original and polished atmosphere">Show previous</button>

<script type="module">
const host=document.querySelector('#fx');
const compare=document.querySelector('#compare');
compare.addEventListener('click',()=>{
  const before=host.classList.toggle('show-before');
  compare.textContent=before?'Show polished':'Show previous';
  compare.setAttribute('aria-pressed',String(!before));
});
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
const edgeLayout=matchMedia('(max-width: 900px), (max-aspect-ratio: 5/4), (min-aspect-ratio: 21/9)');
const saveData=navigator.connection?.saveData===true;
const imageUrl='./media/arcxi/reference-effect-hd.webp?v=1';
const FRAME_MS=1000/12;
let engine=null;
let loading=false;
let failed=false;

function shouldAnimate(){
  return !failed&&!saveData&&!document.hidden&&!reducedMotion.matches&&!edgeLayout.matches;
}

function pause(){
  engine?.stop();
  host.classList.remove('is-animated');
}

async function makeEngine(){
  const THREE=await import('three');
  if(!shouldAnimate())return null;
  const renderer=new THREE.WebGLRenderer({alpha:true,antialias:false,powerPreference:'low-power'});
  let texture;
  try{
    renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
    renderer.setSize(innerWidth,innerHeight,false);
    renderer.setClearColor(0x000000,0);
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    texture=await new THREE.TextureLoader().loadAsync(imageUrl);
    texture.colorSpace=THREE.SRGBColorSpace;
    texture.minFilter=THREE.LinearFilter;
    texture.magFilter=THREE.LinearFilter;
  }catch(error){
    texture?.dispose();
    renderer.dispose();
    throw error;
  }
  if(!shouldAnimate()){
    texture.dispose();
    renderer.dispose();
    return null;
  }
  const scene=new THREE.Scene();
  const camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,10);
  camera.position.z=1;
  const geometry=new THREE.PlaneGeometry(2,2);
  const material=new THREE.MeshBasicMaterial({map:texture,transparent:true,depthWrite:false,opacity:.94});
  const plane=new THREE.Mesh(geometry,material);
  scene.add(plane);
  host.appendChild(renderer.domElement);

  let timer=0;
  let animationFrame=0;
  let running=false;
  const canvas=renderer.domElement;
  function render(){
    const t=performance.now()/1000;
    plane.position.set(Math.sin(t*.10)*.006,Math.cos(t*.085)*.004,0);
    plane.scale.setScalar(1.015+Math.sin(t*.07)*.003);
    renderer.render(scene,camera);
  }
  function tick(){
    animationFrame=0;
    if(!running)return;
    render();
    timer=setTimeout(()=>{animationFrame=requestAnimationFrame(tick)},FRAME_MS);
  }
  function stop(){
    running=false;
    clearTimeout(timer);
    cancelAnimationFrame(animationFrame);
    timer=0;
    animationFrame=0;
  }
  function start(){
    if(running)return;
    running=true;
    render();
    host.classList.add('is-animated');
    timer=setTimeout(()=>{animationFrame=requestAnimationFrame(tick)},FRAME_MS);
  }
  function resize(){
    renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
    renderer.setSize(innerWidth,innerHeight,false);
    if(running)render();
  }
  canvas.addEventListener('webglcontextlost',event=>{
    event.preventDefault();
    failed=true;
    pause();
  });
  return {start,stop,resize};
}

async function sync(){
  host.classList.toggle('no-motion',reducedMotion.matches||saveData||document.hidden);
  if(!shouldAnimate()){
    pause();
    return;
  }
  if(engine){engine.resize();engine.start();return}
  if(loading)return;
  loading=true;
  try{
    engine=await makeEngine();
    if(shouldAnimate())engine?.start();
  }catch(error){
    failed=true;
    pause(); // Keep the static reference artwork when Three.js, WebGL, or the texture fails.
    console.warn('[ARC XI atmosphere] Static artwork fallback:',error);
  }finally{
    loading=false;
  }
}

reducedMotion.addEventListener('change',sync);
edgeLayout.addEventListener('change',sync);
document.addEventListener('visibilitychange',sync);
addEventListener('resize',sync);
addEventListener('pagehide',pause);
addEventListener('pageshow',sync);
sync();
</script>
</body>
</html>
