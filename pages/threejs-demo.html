<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARC XI — Glass Emblem Three.js Demo</title>
<meta name="theme-color" content="#050505">
<style>
  :root{--yellow:#f3e72b;--pink:#f13c91;--bg:#050505}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .site{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
  .demoTag{
    position:fixed;right:22px;bottom:20px;z-index:6;display:flex;align-items:center;gap:9px;
    padding:8px 11px;border:1px solid rgba(255,255,255,.11);border-radius:999px;
    background:rgba(5,5,5,.62);backdrop-filter:blur(12px);color:#d9d6cf;
    font-size:10px;letter-spacing:.08em;text-transform:uppercase
  }
  .demoTag i{width:7px;height:7px;border-radius:50%;background:var(--pink);box-shadow:0 0 12px rgba(241,60,145,.6)}
  .demoTag button{
    appearance:none;border:0;background:transparent;color:#8d8a84;font:inherit;font-size:10px;cursor:pointer;padding:0 0 0 4px
  }
  .demoTag button:hover{color:#fff}
  @media(max-width:720px){.demoTag{right:10px;bottom:10px;font-size:9px}}
  @media(prefers-reduced-motion:reduce){.demoTag i{box-shadow:none}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js"}}
</script>
</head>
<body>
<iframe class="site" src="./#board" title="ARC XI schedule"></iframe>
<div id="fx" aria-hidden="true"></div>
<div class="demoTag"><i></i><span>Glass emblem demo</span><button id="toggle" type="button">hide</button></div>

<script type="module">
import * as THREE from 'three';

const root=document.querySelector('#fx');
const toggle=document.querySelector('#toggle');
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x000000,0);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.18;
root.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);
camera.position.set(0,0,9);

const group=new THREE.Group();
scene.add(group);

function starShape(){
  const shape=new THREE.Shape();
  const outer=1,inner=.43,points=5;
  for(let i=0;i<points*2;i++){
    const r=i%2===0?outer:inner;
    const a=-Math.PI/2+i*Math.PI/points;
    const x=Math.cos(a)*r,y=Math.sin(a)*r;
    if(i===0)shape.moveTo(x,y);else shape.lineTo(x,y);
  }
  shape.closePath();
  return shape;
}

const glass=new THREE.MeshPhysicalMaterial({
  color:0xf13c91,
  metalness:.08,
  roughness:.12,
  transmission:.55,
  thickness:1.25,
  ior:1.45,
  clearcoat:1,
  clearcoatRoughness:.08,
  emissive:0x38081e,
  emissiveIntensity:.5,
  transparent:true,
  opacity:.96
});
const star=new THREE.Mesh(
  new THREE.ExtrudeGeometry(starShape(),{depth:.34,bevelEnabled:true,bevelSegments:5,steps:1,bevelSize:.08,bevelThickness:.07}),
  glass
);
star.geometry.center();
star.rotation.z=-.10;
group.add(star);

const gold=new THREE.MeshPhysicalMaterial({
  color:0xf3d76a,
  metalness:.92,
  roughness:.16,
  clearcoat:1,
  clearcoatRoughness:.1,
  emissive:0x2d2102,
  emissiveIntensity:.16
});
const slash=new THREE.Mesh(new THREE.BoxGeometry(.16,2.65,.17),gold);
slash.rotation.z=-.76;
slash.position.set(.42,.2,.28);
group.add(slash);

const edgeMat=new THREE.MeshBasicMaterial({color:0xff9aca,transparent:true,opacity:.34,blending:THREE.AdditiveBlending,depthWrite:false});
const halo=new THREE.Mesh(new THREE.TorusGeometry(1.23,.012,10,180),edgeMat);
halo.rotation.x=1.13;
halo.rotation.z=-.38;
halo.position.z=-.14;
group.add(halo);

const halo2=new THREE.Mesh(
  new THREE.TorusGeometry(1.48,.008,8,180),
  new THREE.MeshBasicMaterial({color:0xf3e72b,transparent:true,opacity:.14,blending:THREE.AdditiveBlending,depthWrite:false})
);
halo2.rotation.set(.78,.42,.18);
halo2.position.z=-.38;
group.add(halo2);

scene.add(new THREE.AmbientLight(0xffffff,1.15));

const pinkKey=new THREE.PointLight(0xf13c91,38,14,2);
pinkKey.position.set(-2.3,1.8,4.2);scene.add(pinkKey);
const yellowKey=new THREE.PointLight(0xf3e72b,28,14,2);
yellowKey.position.set(2.5,-.7,3.5);scene.add(yellowKey);
const whiteRim=new THREE.PointLight(0xffffff,14,10,2);
whiteRim.position.set(0,3.1,2.2);scene.add(whiteRim);

const shadow=new THREE.Mesh(
  new THREE.CircleGeometry(1.45,64),
  new THREE.MeshBasicMaterial({color:0xf13c91,transparent:true,opacity:.055,depthWrite:false})
);
shadow.scale.set(1.65,.3,1);
shadow.position.set(0,-1.35,-.6);
group.add(shadow);

function place(){
  const narrow=innerWidth<850;
  group.scale.setScalar(narrow?.62:.82);
  group.position.set(
    narrow?-2.15:-3.42,
    narrow?1.52:1.78,
    0
  );
}
place();

let mx=0,my=0,hidden=false,visible=true;
addEventListener('pointermove',e=>{
  mx=(e.clientX/innerWidth-.5)*2;
  my=(e.clientY/innerHeight-.5)*2;
},{passive:true});
addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  place();
});
document.addEventListener('visibilitychange',()=>visible=!document.hidden);

toggle.addEventListener('click',()=>{
  hidden=!hidden;
  root.style.display=hidden?'none':'block';
  toggle.textContent=hidden?'show':'hide';
});

const clock=new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  if(!visible||hidden)return;
  const t=clock.getElapsedTime();
  const targetY=reduceMotion?-.12:-.12+mx*.12;
  const targetX=reduceMotion?.10:.10-my*.06;
  group.rotation.y+=(targetY-group.rotation.y)*.045;
  group.rotation.x+=(targetX-group.rotation.x)*.045;
  if(!reduceMotion){
    group.position.y+=(1.78+Math.sin(t*.62)*.035-group.position.y)*.05;
    halo.rotation.z+=.0009;
    halo2.rotation.y-=.0012;
  }
  renderer.render(scene,camera);
}
frame();
</script>
</body>
</html>
