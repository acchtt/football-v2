const descriptions={ledger:'Editorial chronological match programme; dense fixtures by kickoff.',timeline:'Continuous time axis highlighting simultaneity and the next kickoff.',programme:'Asymmetric editorial cover and competition-led chapters.'};
const state={direction:new URLSearchParams(location.search).get('direction')||'ledger',device:'desktop',filter:'ALL',query:'',date:0};
if(!Object.prototype.hasOwnProperty.call(descriptions,state.direction))state.direction='ledger';
const target=document.getElementById('surface');
const logo=()=>`<img class="brand-logo" src="../media/arcxi/arc-xi-schedule-logo.svg?v=3" alt="ARC XI">`;
function safe(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function crest(team){return logos[team]?`<img class="crest" src="${logos[team]}" alt="">`:`<span class="crest-fallback" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 2 20 5v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5z"/></svg></span>`}
function teamMarkup(name,cls){return `<span class="team ${cls}">${cls==='home'?`<span class="team-name">${safe(name)}</span>${crest(name)}`:`${crest(name)}<span class="team-name">${safe(name)}</span>`}</span>`}
function score(row){return `<span class="score ${row.status==='LIVE'?'is-live':row.score==='VS'?'is-vs':''}">${safe(row.score)}</span>`}
function status(row){return `<span class="fixture-status ${row.status.toLowerCase()}">${row.status==='LIVE'?'LIVE '+safe(row.minute||''):safe(row.status)}</span>`}
function visibleRows(){const date=dates[state.date];return samples.filter(row=>(state.filter==='ALL'||row.status===state.filter)&&(!state.query||[row.home,row.away,row.competition,row.lane].join(' ').toLowerCase().includes(state.query.toLowerCase()))).map(row=>({...row,iso:date.iso}));}
function dateControls(){const d=dates[state.date];return `<span class="date-switch"><button type="button" data-shift="-1" aria-label="Previous sample day" ${state.date===0?'disabled':''}>‹</button><span><strong>${d.short} ${d.day} OCT</strong><small>2026 · ICT</small></span><button type="button" data-shift="1" aria-label="Next sample day" ${state.date===dates.length-1?'disabled':''}>›</button></span>`}
function filters(){return `<div class="filters" role="group" aria-label="Sample match status">${['ALL','LIVE','UPCOMING','FT'].map(s=>`<button type="button" data-filter="${s}" aria-pressed="${state.filter===s}">${s}</button>`).join('')}</div>`}
function searchMarkup(){return `<label class="search-field"><span aria-hidden="true">⌕</span><input type="search" placeholder="Find team or league" aria-label="Find team or league" value="${safe(state.query)}"></label>`}
function toolbar(){return `<div class="controls">${filters()}${searchMarkup()}</div>`}
function empty(){return `<div class="empty">No sample fixtures match this search or status.<br>Try All or clear the search.</div>`}
function titleNote(){return `<div class="sample-ribbon"><span class="dot"></span><b>DESIGN EXPLORATION</b><span>Illustrative fixtures and scores · ICT calendar dates</span></div>`}
function sampleRow(row,type){const link=`data-match="${row.id}"`;
 if(type==='ledger')return `<button type="button" class="fixture-button ledger-match" ${link}>${status(row)}<span class="pair">${teamMarkup(row.home,'home')}${score(row)}${teamMarkup(row.away,'away')}</span><span class="league-mark">${safe(row.competition)}<br><span class="lane ${row.lane.toLowerCase()}">${row.lane}</span></span></button>`;
 if(type==='timeline')return `<button type="button" class="fixture-button timeline-event" ${link}>${status(row)}<span class="pair">${teamMarkup(row.home,'home')}${score(row)}${teamMarkup(row.away,'away')}</span><span class="league-mark">${safe(row.competition)}<br><span class="lane ${row.lane.toLowerCase()}">${row.lane}</span></span></button>`;
 return `<button type="button" class="fixture-button programme-match" ${link}><span class="time num">${row.time}</span>${status(row)}<span class="pair">${teamMarkup(row.home,'home')}${score(row)}${teamMarkup(row.away,'away')}</span></button>`;
}
function groupBy(rows,key){const map=new Map();rows.forEach(r=>{const group=key(r);if(!map.has(group))map.set(group,[]);map.get(group).push(r)});return map}
function renderLedger(rows){const d=dates[state.date],groups=groupBy(rows,r=>r.time.slice(0,2));return `<section class="ledger"><aside class="ledger-rail">${logo()}<div><div class="eyebrow">THE MATCHDAY EDITION / ICT</div><div class="ledger-date num">${d.day}</div><div class="ledger-weekday">${d.weekday}</div></div>${dateControls()}<nav class="ledger-navigation" aria-label="Concept sections"><button class="active" type="button" data-scroll=".ledger-main">TODAY'S FIXTURES ↗</button><button type="button" data-scroll=".ledger-toolbar">FILTER MATCHES ↗</button></nav><div class="tail tagline">IVE × ARC XI<br><br>ALWAYS MORE THAN A GAME</div></aside><div class="ledger-main"><div class="ledger-top"><span class="eyebrow">ARC XI / THE DAILY LEDGER</span><span class="tagline">ISSUE 008 — 026</span></div><h1 class="wordmark ledger-headline">MATCHDAY<br><span class="stroke">LEDGER</span><span class="yellow">.</span></h1><p class="ledger-subtitle">One uninterrupted run of fixtures. Time leads; competition and score remain instantly scannable.</p>${titleNote()}<div class="ledger-toolbar">${toolbar()}</div>${rows.length?Array.from(groups.entries()).map(([hour,g])=>`<section class="ledger-band"><div class="ledger-hour num">${hour}:00</div><div class="ledger-band-body"><div class="ledger-band-sub">${g.length} FIXTURE${g.length!==1?'S':''} · ${g.map(x=>x.competition).filter((x,i,a)=>a.indexOf(x)===i).join(' · ')}</div>${g.map(r=>sampleRow(r,'ledger')).join('')}</div></section>`).join(''):empty()}</div><aside class="ledger-aside" aria-label="IVE artwork"><div class="ledger-aside-top"><div class="tagline">IVE × ARC XI</div><div class="outlined">IVE<br>XI</div></div><div class="artwork" aria-hidden="true"></div><div class="ledger-aside-bottom">MATCHDAY AS AN EDITORIAL OBJECT<br><br>ALWAYS MORE THAN A GAME</div></aside></section>`}
function renderTimeline(rows){const d=dates[state.date],groups=groupBy(rows,r=>r.time);return `<section class="timeline"><header class="timeline-mast">${logo()}<div class="timeline-mark">MATCHES / A CONTINUOUS DAY</div><span class="tagline">IVE × ARC XI</span></header><div class="timeline-content"><div class="timeline-head"><div><div class="eyebrow">ARC XI / KICKOFF TIMELINE</div><h1 class="wordmark timeline-title">EVERY<br><span>KICKOFF.</span><br>IN TIME.</h1><div class="timeline-deck">Watch the day unfold from midnight onwards. Simultaneous kickoffs share the same axis instead of competing for table space.</div></div><div class="timeline-date-panel"><div class="eyebrow">MATCHDAY / ICT</div><strong class="num">${d.day} <span class="yellow">OCT</span></strong>${dateControls()}</div></div>${titleNote()}<div class="timeline-controls">${toolbar()}</div><div class="timeline-stream">${rows.length?Array.from(groups.entries()).map(([time,g],index)=>`<section class="timeline-node">${index===1?'<div class="timeline-current">TIME AXIS · SAMPLE</div>':''}<div><div class="timeline-stamp num">${time}</div><div class="timeline-note">${g.length} fixture${g.length!==1?'s':''} at once</div></div><div class="timeline-events">${g.map(r=>sampleRow(r,'timeline')).join('')}</div></section>`).join(''):empty()}</div><div class="timeline-art"><div class="copy"><small>IVE × ARC XI</small>ALWAYS MORE<br>THAN A GAME</div><div class="artwork" aria-hidden="true"></div></div></div></section>`}
function renderProgramme(rows){const d=dates[state.date],groups=groupBy(rows,r=>r.competition);return `<section class="programme"><header class="programme-mast">${logo()}<div class="programme-mast-center">ARC XI × IVE / MATCH PROGRAMME</div><div class="programme-mast-right">ISSUE ${d.day}.10.26<br>ICT EDITION</div></header><div class="programme-cover"><div class="programme-cover-copy"><div class="eyebrow">THE OFFICIAL CONCEPT STUDY · EDITION 03</div><h1 class="wordmark programme-title">THE<br><span class="outlined">MATCH</span><br>ISSUE.</h1><div class="cover-number num">${d.day}<span class="pink">/10</span></div><div class="tagline">FOOTBALL × FASHION / ARC XI</div></div><div class="programme-cover-art"><div class="artwork" aria-hidden="true"></div><div class="overlay">IVE × ARC XI / MATCHDAY CULTURE</div></div></div><div class="programme-inner">${titleNote()}<div class="programme-strip"><div>${dateControls()}</div>${toolbar()}</div><div class="programme-chapters">${rows.length?Array.from(groups.entries()).map(([competition,g],i)=>`<section class="programme-chapter"><div class="programme-chapter-head"><strong>${safe(competition)}</strong><em>CHAPTER ${String(i+1).padStart(2,'0')} / ${g.length} MATCH${g.length===1?'':'ES'}</em></div>${g.map(r=>sampleRow(r,'programme')).join('')}</section>`).join(''):empty()}<div class="programme-feature"><div><small>THE RITUAL OF THE MATCHDAY</small><br><strong>FOOTBALL IS<br><span class="pink">CULTURE.</span></strong></div><div class="feature-copy">The competition-led reading experience. The editorial front cover is an atmosphere, not a separate landing page.</div></div></div><footer class="programme-bottom"><span>ARC XI / MATCHDAY PROGRAMME</span><span>ALWAYS MORE THAN A GAME</span></footer></div></section>`}
function render({preserveFocus=false}={}){const focus=document.activeElement;const selection=focus?.matches?.('input[type=search]')?focus.selectionStart:null;const rows=visibleRows();target.innerHTML=state.direction==='ledger'?renderLedger(rows):state.direction==='timeline'?renderTimeline(rows):renderProgramme(rows);document.querySelectorAll('[data-direction]').forEach(button=>button.setAttribute('aria-selected',String(button.dataset.direction===state.direction)));document.getElementById('direction-description').innerHTML=`<strong>${state.direction==='ledger'?'Matchday Ledger':state.direction==='timeline'?'Kickoff Timeline':'Stadium Programme'}</strong> — ${descriptions[state.direction]}`;if(preserveFocus&&focus?.matches?.('input[type=search]')){const input=target.querySelector('input[type=search]');input?.focus();if(selection!==null)try{input.setSelectionRange(selection,selection)}catch(e){}}}
function setDirection(next){if(!Object.prototype.hasOwnProperty.call(descriptions,next))return;state.direction=next;state.filter='ALL';state.query='';if(location.protocol==='http:'||location.protocol==='https:')history.replaceState(null,'',`${location.pathname}?direction=${next}`);render();}
document.querySelectorAll('[data-direction]').forEach(b=>b.addEventListener('click',()=>setDirection(b.dataset.direction)));
document.querySelectorAll('[data-device]').forEach(b=>b.addEventListener('click',()=>{state.device=b.dataset.device;document.getElementById('viewport').classList.toggle('phone',state.device==='phone');document.querySelectorAll('[data-device]').forEach(x=>{x.classList.toggle('active',x.dataset.device===state.device);x.setAttribute('aria-pressed',String(x.dataset.device===state.device))});render()}));
target.addEventListener('click',e=>{const filter=e.target.closest('[data-filter]');if(filter){state.filter=filter.dataset.filter;render();return;}const shift=e.target.closest('[data-shift]');if(shift){state.date=Math.max(0,Math.min(dates.length-1,state.date+Number(shift.dataset.shift)));render();return;}const match=e.target.closest('[data-match]');if(match){const row=samples.find(r=>r.id===match.dataset.match);if(!row)return;document.getElementById('dialog-title').textContent=row.home+' — '+row.away;document.getElementById('dialog-meta').innerHTML=[['Kickoff (ICT)',dates[state.date].iso+' · '+row.time],['Competition',row.competition],['Status',row.status+(row.minute?' '+row.minute:'')],['Illustrative score',row.score],['Operational lane',row.lane]].map(([k,v])=>`<div><dt>${safe(k)}</dt><dd>${safe(v)}</dd></div>`).join('');document.getElementById('match-dialog').showModal();return;}const scroll=e.target.closest('[data-scroll]');if(scroll){target.querySelector(scroll.dataset.scroll)?.scrollIntoView({block:'start',behavior:'smooth'})}});
target.addEventListener('input',e=>{if(e.target.matches('input[type=search]')){state.query=e.target.value;render({preserveFocus:true})}});
document.getElementById('dialog-close').addEventListener('click',()=>document.getElementById('match-dialog').close());
render();
</script></body></html>
