<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090b0f" />
  <title>SlipTrace Offline</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#090b0f;color:#f4f7fb}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 5%,rgba(255,82,101,.12),transparent 30%),radial-gradient(circle at 85% 0,rgba(73,207,232,.11),transparent 30%),#090b0f}
    main{width:min(100%,420px);padding:24px;border:1px solid #293641;border-radius:18px;background:#0e141b;box-shadow:0 24px 80px rgba(0,0,0,.45)}
    .mark{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;margin-bottom:18px;background:linear-gradient(135deg,#ff5265,#49cfe8);color:#081016;font-weight:900;letter-spacing:-.04em}
    h1{margin:0 0 8px;font-size:26px}p{margin:0;color:#9da9b6;line-height:1.55;font-size:14px}a{display:flex;align-items:center;justify-content:center;min-height:48px;margin-top:20px;border:1px solid #3b4b58;border-radius:12px;background:#121b24;color:#eef4f8;text-decoration:none;font-weight:800}
  </style>
</head>
<body><main><div class="mark">ST</div><h1>You’re offline</h1><p>SlipTrace can open its saved app shell without a connection, but live scores and match data need the network. Reconnect, then try again.</p><a href="./#today">Retry Matchday</a></main></body>
</html>
