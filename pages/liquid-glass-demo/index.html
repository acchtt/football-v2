const ART_BASE='https://acchtt.github.io/football-v2/';
const styles={original:'Current design',frost:'Soft Frost',depth:'Liquid Depth',prism:'Prism Edge'};
const params=new URLSearchParams(location.search);const isEmbed=params.get('embed')==='1';
const defaultStyle=Object.hasOwn(styles,params.get('skin'))?params.get('skin'):'depth';
const compareDefault=params.get('compare')==='1';
const state={style:defaultStyle,comparison:compareDefault,device:'desktop',right:'depth',date:9,status:'all',search:'',collapsed:new Set()};
const fixtures=[
 {league:'Premier League',country:'ENGLAND',home:'Arsenal',away:'Chelsea',time:'19:00',status:'live',score:'2–1',minute:'64′',lane:'FOCUS'},
 {league:'Premier League',country:'ENGLAND',home:'Chelsea',away:'Arsenal',time:'21:00',status:'pre',score:'VS',lane:'FOLLOW'},
 {league:'Serie A',country:'ITALY',home:'Inter',away:'Napoli',time:'20:45',status:'ft',score:'1–0',lane:'RESERVE'},
 {league:'Serie A',country:'ITALY',home:'Juventus',away:'Milan',time:'22:30',status:'pre',score:'VS',lane:'FOLLOW'},
 {league:'LaLiga',country:'SPAIN',home:'Barcelona',away:'Valencia',time:'23:00',status:'pre',score:'VS',lane:'STOP'},
 {league:'Scottish Premiership',country:'SCOTLAND',home:'Celtic',away:'Rangers',time:'19:45',status:'live',score:'0–0',minute:'39′',lane:'FOCUS'}
];
const logoFallback='<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor"><path d="M12 2 20 5v7c0 5-4 8-8 10-4-2-8-5-8-10V5z"/></svg>';
function esc(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function crest(team){const src=LOGOS[team];return src?`<img class="crest" alt="${esc(team)} crest" src="${src}">`:`<span class="crest-fallback" title="Logo unavailable">${logoFallback}</span>`}
function leagueIcon(name){if(name==='Premier League')return `<img class="crest" alt="Premier League logo" src="${LOGOS['Premier League']||''}">`;return `<span class="crest-fallback" aria-hidden="true">${name==='Serie A'?'A':name==='LaLiga'?'L':'S'}</span>`}
function boardMarkup(){return `<div id="site"><div class="art" aria-hidden="true"></div><header class="brandbar"><a class="logo" href="${ART_BASE}" title="ARC XI production site" target="_blank" rel="noopener"><img src="${ART_BASE}media/arcxi/arc-xi-schedule-logo.svg" alt="ARC XI — live football schedule" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span hidden class="logo-fallback">ARC XI<em>LIVE FOOTBALL SCHEDULE</em></span></a><div class="navdates"><button type="button" class="date-switch" data-shift="-1" aria-label="Previous demo day">‹</button><div class="date-strip">${[7,8,9,10,11].map(d=>`<button type="button" class="date" data-date="${d}" aria-pressed="${d===state.date}"><small>${['WED','THU','FRI','SAT','SUN'][d-7]}</small><strong>${d} OCT</strong></button>`).join('')}</div><button type="button" class="date-switch" data-shift="1" aria-label="Next demo day">›</button></div><div class="rightmark"><span>IVE × ARC XI</span><button type="button" class="menu" aria-label="About demo" data-about>☰</button></div></header><main class="mainarea"><div class="toolbar"><div class="filters" role="group" aria-label="Match status">${[['all','ALL'],['live','LIVE'],['pre','UPCOMING'],['ft','FT']].map(([k,t])=>`<button type="button" class="${k==='live'?'live':''}" data-filter="${k}" aria-pressed="${k===state.status}">${t}</button>`).join('')}</div><label class="search"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" stroke="currentColor" fill="none" stroke-width="2"><circle cx="10" cy="10" r="6"/><path d="m14 14 6 6"/></svg><input type="search" aria-label="Search demo fixtures" placeholder="Search matches" value="${esc(state.search)}"></label></div><p class="sample-note">ILLUSTRATIVE FIXTURES · 0 LIVE PROVIDER CONNECTIONS · SELECTED DATE: ${state.date} OCT 2026</p><div id="fixtures"></div><footer class="foot"><b>✳</b> ALWAYS MORE THAN A GAME · ARC XI / IVE</footer></main><dialog class="dialog" id="details"><button class="close" data-close>Close</button><h2 id="detail-heading"></h2><p id="detail-content"></p><p>Design interaction only; no live bets, results, or score changes.</p></dialog></div>`}
function currentRows(){const days={7:[0,3],8:[1,2,5],9:[0,1,2,3,4,5],10:[0,4,5],11:[2,3]};let rows=fixtures.filter((x,i)=>days[state.date].includes(i)&&(state.status==='all'||x.status===state.status));if(state.search)rows=rows.filter(x=>(x.home+' '+x.away+' '+x.league).toLowerCase().includes(state.search.toLowerCase()));return rows}
function renderFixtures(){const node=document.getElementById('fixtures');if(!node)return;const rows=currentRows();const names=['Premier League','Serie A','LaLiga','Scottish Premiership'];node.innerHTML=rows.length?names.map(name=>{const selected=rows.filter(x=>x.league===name);if(!selected.length)return '';const collapsed=state.collapsed.has(name);return `<section class="competition"><button class="competition-head" type="button" data-league="${esc(name)}" aria-expanded="${!collapsed}">${leagueIcon(name)}<strong>${esc(name)}</strong><span class="country">${esc(selected[0].country)}</span><span class="chev">${collapsed?'▸':'⌄'}</span></button>${collapsed?'':selected.map(x=>`<div class="match-row" data-match="${fixtures.indexOf(x)}" role="button" tabindex="0" aria-label="${esc(x.home)} versus ${esc(x.away)}, ${esc(x.status==='pre'?'upcoming':x.status==='ft'?'finished':'live')}"><div class="time-cell"><span class="ko">${x.time}</span><span class="pill ${x.status==='live'?'live':x.lane.toLowerCase()}">${x.status==='live'?x.minute:x.status==='ft'?'FT':x.lane}</span></div><div class="teams"><div class="team home"><span>${esc(x.home)}</span>${crest(x.home)}</div><div class="score ${x.status==='pre'?'pre':''} ${x.status==='live'?'live-score':''}">${esc(x.score)}</div><div class="team away">${crest(x.away)}<span>${esc(x.away)}</span></div></div><span class="arrow">›</span></div>`).join('')}</section>`}).join(''):`<div class="empty">No example matches found. Try clearing the search or selecting ALL.</div>`}
function renderEmbedded(){document.body.classList.add('embed');document.body.dataset.skin=defaultStyle;document.getElementById('root').innerHTML=boardMarkup();renderFixtures()}
function makeFrame(skin,label){const current=new URL(location.href);current.search='';current.searchParams.set('embed','1');current.searchParams.set('skin',skin);return `<div class="frame-wrap"><div class="frame-label"><strong>${esc(label)}</strong><span>${esc(styles[skin])}</span></div><iframe class="demo-iframe" loading="eager" title="${esc(label)} Liquid Glass comparison" src="${esc(current.href)}"></iframe></div>`}
function renderShell(){document.body.classList.add('app-shell');document.body.classList.remove('embed');document.getElementById('root').innerHTML=`<div class="shell"><header class="topbar"><div class="brand"><b>ARC XI</b> / LIQUID GLASS LAB</div><div class="choices" role="group" aria-label="Choose surface treatment">${Object.entries(styles).map(([k,v])=>`<button type="button" data-skin="${k}" aria-pressed="${k===state.style}">${esc(v)}</button>`).join('')}</div><div class="tools"><button type="button" data-compare aria-pressed="${state.comparison}">${state.comparison?'Exit compare':'Compare two'}</button><button type="button" data-device="desktop" aria-pressed="${state.device==='desktop'}">Desktop</button><button type="button" data-device="phone" aria-pressed="${state.device==='phone'}">Phone</button></div></header><div class="page-note"><b>DESIGN STUDY — NOT LIVE.</b> Same sample fixtures, date controls and match interactions in every version. No production changes. ${state.comparison?'Comparing current ARC XI against the selected glass treatment.':''}</div><div class="preview-shell"><div class="stage ${state.comparison?'is-compare':''} ${state.device==='phone'?'is-phone':''}">${state.comparison?makeFrame('original','Current / before')+makeFrame(state.style==='original'?'depth':state.style,'Proposed / after'):makeFrame(state.style,styles[state.style])}</div></div></div>`}
function openDetail(idx){const x=fixtures[idx];if(!x)return;const d=document.getElementById('details');document.getElementById('detail-heading').textContent=x.home+' — '+x.away;document.getElementById('detail-content').textContent=x.league+' · 9 Oct 2026 (sample day '+state.date+') · '+x.time+' ICT · '+(x.status==='pre'?'Upcoming':x.status==='ft'?'FT':'Live demo '+x.minute)+' · '+x.lane;d.showModal()}
document.addEventListener('click',event=>{const target=event.target.closest('button,[data-match]');if(!target)return;if(isEmbed){if(target.hasAttribute('data-date')){state.date=Number(target.dataset.date);document.querySelectorAll('[data-date]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.date)===state.date)));document.querySelector('.sample-note').textContent='ILLUSTRATIVE FIXTURES · 0 LIVE PROVIDER CONNECTIONS · SELECTED DATE: '+state.date+' OCT 2026';renderFixtures();return}if(target.hasAttribute('data-shift')){state.date=Math.min(11,Math.max(7,state.date+Number(target.dataset.shift)));document.querySelectorAll('[data-date]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.date)===state.date)));document.querySelector('.sample-note').textContent='ILLUSTRATIVE FIXTURES · 0 LIVE PROVIDER CONNECTIONS · SELECTED DATE: '+state.date+' OCT 2026';renderFixtures();return}if(target.hasAttribute('data-filter')){state.status=target.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===state.status)));renderFixtures();return}if(target.hasAttribute('data-league')){const name=target.dataset.league;state.collapsed.has(name)?state.collapsed.delete(name):state.collapsed.add(name);renderFixtures();return}if(target.hasAttribute('data-match')){openDetail(Number(target.dataset.match));return}if(target.hasAttribute('data-close')){document.getElementById('details').close();return}if(target.hasAttribute('data-about')){document.getElementById('detail-heading').textContent='ARC XI — Glass Lab';document.getElementById('detail-content').textContent='These are illustrative fixtures used to compare surfaces. No live data or predictions are loaded.';document.getElementById('details').showModal();return}}
else{if(target.hasAttribute('data-skin')){state.style=target.dataset.skin;renderShell();return}if(target.hasAttribute('data-compare')){state.comparison=!state.comparison;renderShell();return}if(target.hasAttribute('data-device')){state.device=target.dataset.device;renderShell();return}}});
document.addEventListener('input',e=>{if(isEmbed&&e.target.matches('.search input')){state.search=e.target.value;renderFixtures()}});
document.addEventListener('keydown',e=>{if(isEmbed&&(e.key==='Enter'||e.key===' ')&&e.target.hasAttribute('data-match')){e.preventDefault();openDetail(Number(e.target.dataset.match))}});
if(isEmbed)renderEmbedded();else renderShell();
</script>
